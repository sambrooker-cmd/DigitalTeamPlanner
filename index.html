function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  if (!dateStr) return '';

// --- Calendar month-grid helpers (all local-time; never round-trips sendDate strings

function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

function addMonths(d, n) {
  return new Date(d.getFullYear(), d.getMonth() + n, 1);
}

function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 6 weeks (42 days), Monday-start, covering the month plus lead/trail days.
function buildMonthGrid(monthStart) {
  const firstWeekday = (monthStart.getDay() + 6) % 7; // 0 = Monday
  const gridStart = new Date(monthStart);
  gridStart.setDate(monthStart.getDate() - firstWeekday);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    days.push(d);
  }
  return days;
}

// --- Timeline helpers ---
function taskDates(promo) {
  const launch = new Date(promo.launchDate);
  const dueTimes = promo.tasks.map((t) => t.due).filter(Boolean).map((d) => new Date(d).getTime());
  const startTime = dueTimes.length ? Math.min(...dueTimes, launch.getTime()) : launch.getTime() - 14 * 86400000;
  const hasRealEnd = !!promo.endDate;
  const end = hasRealEnd ? new Date(promo.endDate) : new Date(launch.getTime() + 14 * 86400000);
  return {
    start: new Date(startTime),
    launch,
    end,
    hasRealEnd,
    // Reporting wraps up roughly two weeks after the promotion actually ends.
    reportEnd: new Date(end.getTime() + 14 * 86400000),
  };
}

function promoStageLabel(promo) {
  if (!promo.tasks.length) return 'Not started';
  const idx = Math.min(...promo.tasks.map((t) => STATUSES.indexOf(t.status)));
  return STATUSES[idx];
}

// Same {start, launch, end, hasRealEnd} shape as taskDates, for a paidTests/croTests item.
// "Prepping" runs from when the test was logged (createdAt) to its start date; "live testing"
// runs start date to end date (or a 14-day estimate when no end date is set yet).
function testDates(item) {
  const liveStart = new Date(item.startDate);
  const prepStartRaw = item.createdAt && typeof item.createdAt.toDate === 'function' ? item.createdAt.toDate() : liveStart;
  const start = prepStartRaw.getTime() < liveStart.getTime() ? prepStartRaw : liveStart;
  const hasRealEnd = !!item.endDate;
  const end = hasRealEnd ? new Date(item.endDate) : new Date(liveStart.getTime() + 14 * 86400000);
  return { start, launch: liveStart, end, hasRealEnd };
}

// `getDates(item)` returns at least {start, end} — the range that should be visible, padded 5
// days each side. Promotions pass reportEnd as `end` here (room for the Reports stage); tests
// just use their own end/estimate.
function computeRange(items, getDates) {
  const all = [new Date()];
  items.forEach((it) => {
    const { start, end } = getDates(it);
    all.push(start, end);
  });
  const min = new Date(Math.min(...all.map((d) => d.getTime())) - 5 * 86400000);
  const max = new Date(Math.max(...all.map((d) => d.getTime())) + 5 * 86400000);
  return { min, max };
}

const DAY_MS = 86400000;
function dayOffsetPx(date, min, dayWidth) {
  return ((date.getTime() - min.getTime()) / DAY_MS) * dayWidth;
}

function monthTicks(min, max) {
  const ticks = [];
  let cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) {
    ticks.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return ticks;
}

  const [user, setUser] = useState(undefined); // undefined = checking, null = signed out
  useEffect(() => onAuthStateChanged(auth, (u) => setUser(u || null)), []);
  return user;
}

function useAllowed(email) {
  const [allowed, setAllowed] = useState(null); // null = checking
  useEffect(() => {
    if (!email) { setAllowed(null); return; }
    let cancelled = false;
    setAllowed(null);
    getDoc(doc(fdb, 'allowlist', email))
      .then((snap) => { if (!cancelled) setAllowed(snap.exists()); })
      .catch(() => { if (!cancelled) setAllowed(false); });
    return () => { cancelled = true; };
  }, [email]);
  return allowed;
}

}

// --- Backend: Firestore, shared with everyone on the allowlist ---
function useOnlineStatus() {
  const [online, setOnline] = useState(typeof navigator === 'undefined' ? true : navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener('online', on);
    window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  return online;
}

const MOBILE_QUERY = '(max-width: 720px)';
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== 'undefined' ? window.matchMedia(MOBILE_QUERY).matches : false));
  useEffect(() => {
    const mq = window.matchMedia(MOBILE_QUERY);
    const handler = (ev) => setIsMobile(ev.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);
  return isMobile;
}

// Click-and-drag panning for a horizontally-scrollable container (touch already scrolls it
// natively). A small movement threshold keeps an ordinary click on something inside it working.
function useDragScroll(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let down = false;
    let dragging = false;
    let startX = 0;
    let startScroll = 0;
    function onDown(ev) {
      down = true;
      dragging = false;
      startX = ev.pageX;
      startScroll = el.scrollLeft;
    }
    function onMove(ev) {
      if (!down) return;
      const dx = ev.pageX - startX;
      if (!dragging && Math.abs(dx) > 4) {
        dragging = true;
        el.style.cursor = 'grabbing';
        el.style.userSelect = 'none';
      }
      if (dragging) {
        ev.preventDefault();
        el.scrollLeft = startScroll - dx;
      }
    }
    function onUp() {
      down = false;
      el.style.cursor = 'grab';
      el.style.userSelect = '';
      if (dragging) {
        // A real drag ending over a row would otherwise still fire that row's click right
        // after this — swallow the one click the browser is about to dispatch.
        const blockClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        window.addEventListener('click', blockClick, { capture: true, once: true });
      }
      dragging = false;
    }
    el.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      el.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [ref]);
}

function useTasksByPromo(promoIds) {
  const [tasksByPromo, setTasksByPromo] = useState({});
  const unsubsRef = useRef({});
  const idsKey = promoIds.join(',');
  useEffect(() => {
    const currentIds = new Set(promoIds);
    promoIds.forEach((id) => {
      if (!unsubsRef.current[id]) {
        unsubsRef.current[id] = onSnapshot(
          collection(fdb, 'promotions', id, 'tasks'),
          (snap) => {
            const tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setTasksByPromo((prev) => ({ ...prev, [id]: tasks }));
          },
          () => {}
        );
      }
    });
    Object.keys(unsubsRef.current).forEach((id) => {
      if (!currentIds.has(id)) {
        unsubsRef.current[id]();
        delete unsubsRef.current[id];
        setTasksByPromo((prev) => { const next = { ...prev }; delete next[id]; return next; });
      }
    });
  }, [idsKey]);
  useEffect(() => () => { Object.values(unsubsRef.current).forEach((fn) => fn()); }, []);
  return tasksByPromo;
}

function useActivityLog(active) {
  const [entries, setEntries] = useState(null); // null = loading
  useEffect(() => {
    if (!active) return;
    const q = query(collection(fdb, 'activity'), orderBy('at', 'desc'), limit(100));
    const unsub = onSnapshot(q, (snap) => setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setEntries((prev) => prev || []));
    return unsub;
  }, [active]);
  return entries;
}

function PromotionPlanner({ user }) {
  const online = useOnlineStatus();
  const isMobile = useIsMobile();
  const pagePadding = isMobile ? '1rem' : '1.5rem 2rem';
  const seededRef = useRef(false);
  const actorName = user.displayName || user.email;

  async function logActivity(entry) {
    try { await addDoc(collection(fdb, 'activity'), { ...entry, by: actorName, at: serverTimestamp() }); } catch (err) {}
  }

  const promoDocs = usePromotionsCollection();
  const promoIds = useMemo(() => (promoDocs || []).map((p) => p.id), [promoDocs]);
  const tasksByPromo = useTasksByPromo(promoIds);
  const emails = useEmailsCollection();
  const paidTests = useCollectionDocs('paidTests', 'startDate');
  const croTests = useCollectionDocs('croTests', 'startDate');

  // Seed the store once, guarded by a transaction so concurrent first-openers don't double-seed.
  useEffect(() => {
    if (seededRef.current) return;
    seededRef.current = true;
    (async () => {
      try {
        const shouldSeed = await runTransaction(fdb, async (tx) => {
          const sentinelRef = doc(fdb, 'meta', 'seed');
          const snap = await tx.get(sentinelRef);
          if (snap.exists()) return false;
          tx.set(sentinelRef, { seededAt: Date.now() });
          return true;
        });
        if (!shouldSeed) return;
        const seed = seedPromotions();
        for (const promo of seed) {
          const { tasks, id, ...meta } = promo;
          await setDoc(doc(fdb, 'promotions', id), meta);
          for (const task of tasks) {
            const { id: taskId, ...taskData } = task;
            await setDoc(doc(fdb, 'promotions', id, 'tasks', taskId), taskData);
          }
        }
      } catch (err) { /* seeding is best-effort */ }
    })();
  }, []);

  const promotions = useMemo(() => {
    if (!promoDocs) return null;
    return promoDocs.map((p) => ({ ...p, tasks: tasksByPromo[p.id] || [] }));
  }, [promoDocs, tasksByPromo]);

  const timelinePromotions = useMemo(() => (promotions || []).filter((p) => !p.archived), [promotions]);

  // Merged, chronologically-sorted list for the unified Overview timeline.
  const rollupItems = useMemo(() => {
    const items = [];
    timelinePromotions.forEach((p) => items.push({
      id: `promotion-${p.id}`, kind: 'promotion', name: p.name, dates: taskDates(p), stage: promoStageLabel(p),
      onOpen: () => { setActivePromoId(p.id); setSection('promotions'); setPromoView('board'); },
    }));
    (emails || []).forEach((em) => {
      const d = em.sendDate ? new Date(em.sendDate) : new Date();
      items.push({
        id: `email-${em.id}`, kind: 'email', name: em.subject, dates: { start: d, launch: d, end: d, hasRealEnd: false }, stage: em.status,
        onOpen: () => { setSection('retention'); setEmailView('board'); openEditEmail(em); },
      });
    });
    (paidTests || []).forEach((t) => items.push({
      id: `paid-${t.id}`, kind: 'paid', name: t.name, dates: testDates(t), stage: t.status,
      onOpen: () => { setSection('acquisition'); setAcqView('board'); openEditTest(TEST_TRACKERS.paid, t); },
    }));
    (croTests || []).forEach((t) => items.push({
      id: `cro-${t.id}`, kind: 'cro', name: t.name, dates: testDates(t), stage: t.status,
      onOpen: () => { setSection('website'); setWebView('board'); openEditTest(TEST_TRACKERS.cro, t); },
    }));
    items.sort((a, b) => a.dates.launch.getTime() - b.dates.launch.getTime());
    return items;
  }, [timelinePromotions, emails, paidTests, croTests]);

  const [activePromoId, setActivePromoId] = useState(null);
  useEffect(() => {
    if (promotions && promotions.length && !activePromoId) {
      setActivePromoId((promotions.find((p) => !p.archived) || promotions[0]).id);
    }
  }, [promotions]);

  // Top-level navigation is by team; each section remembers its own board/timeline(/calendar) sub-view.
  const [section, setSection] = useState('promotions'); // 'promotions' | 'acquisition' | 'retention' | 'website' | 'activity'
  const [promoView, setPromoView] = useState('board'); // 'board' | 'timeline'
  const [acqView, setAcqView] = useState('board'); // 'board' | 'timeline' (Paid Media)
  const [webView, setWebView] = useState('board'); // 'board' | 'timeline' (CRO/UX)
  const activityEntries = useActivityLog(section === 'activity');
  const timelineScrollRef = useRef(null);
  useDragScroll(timelineScrollRef);
  useEffect(() => {
    if (!timelineScrollRef.current) return;
    let items = null;
    let getDates = null;
    if (section === 'overview') { items = rollupItems; getDates = (it) => it.dates; }
    else if (section === 'promotions' && promoView === 'timeline') { items = timelinePromotions; getDates = taskDates; }
    else if (section === 'acquisition' && acqView === 'timeline') { items = paidTests || []; getDates = testDates; }
    else if (section === 'website' && webView === 'timeline') { items = croTests || []; getDates = testDates; }
    else return;
    const r = computeRange(items, getDates);
    const dayWidth = isMobile ? 22 : 34;
    timelineScrollRef.current.scrollLeft = Math.max(dayOffsetPx(new Date(), r.min, dayWidth) - 80, 0);
  }, [section, promoView, acqView, webView, rollupItems, timelinePromotions, paidTests, croTests, isMobile]);
  const [showArchived, setShowArchived] = useState(false);
  const [activeFilters, setActiveFilters] = useState(new Set());
  const [draggedTaskId, setDraggedTaskId] = useState(null);
  const [taskModal, setTaskModal] = useState(false);
  const [promoModal, setPromoModal] = useState(false);
  const [promoForm, setPromoForm] = useState(null);
  const [taskForm, setTaskForm] = useState(null);
  const [busy, setBusy] = useState(false);
  const [emailView, setEmailView] = useState('board');
  const [calendarMonth, setCalendarMonth] = useState(() => startOfMonth(new Date()));
  const [emailModal, setEmailModal] = useState(false);
  const [emailForm, setEmailForm] = useState(null);
  const [draggedEmailId, setDraggedEmailId] = useState(null);
  const [testModal, setTestModal] = useState(false);
  const [testForm, setTestForm] = useState(null);
  const [draggedTestId, setDraggedTestId] = useState(null);

  const activePromo = promotions ? (promotions.find((p) => p.id === activePromoId) || promotions[0]) : null;

  function progressFor(promo) {
    if (!promo.tasks.length) return 0;
    const live = promo.tasks.filter((t) => t.status === 'Live' || t.status === 'Reports').length;
    return Math.round((live / promo.tasks.length) * 100);
  }

  // --- Mutations, all against Firestore, each stamped with who/when and logged ---
  async function addTask(promoId, promoName, data) {
    setBusy(true);
    try {
      await addDoc(collection(fdb, 'promotions', promoId, 'tasks'), {
        ...data, createdBy: actorName, createdAt: serverTimestamp(), updatedBy: actorName, updatedAt: serverTimestamp(),
      });

  async function saveExistingTask(promoId, promoName, taskId, data) {
    setBusy(true);
    try {
      // A merge update, not a full replace: older tasks saved before some fields existed
      // (createdBy/createdAt) don't carry them, and Firestore rejects `undefined` values —
      // updateDoc only touches the fields we actually pass, so that's never a problem here.
      await updateDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId), { ...data, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'task_updated', promoId, promoName, taskTitle: data.title });
    } finally { setBusy(false); }

  async function moveTask(promoId, promoName, taskId, taskTitle, patch, fromStatus) {

      const ref = await addDoc(collection(fdb, 'promotions'), {
        ...data, createdBy: actorName, createdAt: serverTimestamp(), updatedBy: actorName, updatedAt: serverTimestamp(),

  }

  async function saveExistingPromotion(promoId, data) {
    setBusy(true);
    try {
      // Merge update, same reasoning as saveExistingTask above.
      await updateDoc(doc(fdb, 'promotions', promoId), { ...data, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'promo_updated', promoId, promoName: data.name });
    } finally { setBusy(false); }
  }

  async function deletePromotion(promoId, promoName) {

      for (const t of tasksSnap.docs) await deleteDoc(doc(fdb, 'promotions', promoId, 'tasks', t.id));

  // --- Email mutations: a flat top-level collection, no team dimension (like a task, not a promotion). ---

  async function savePromo() {
    if (!promoForm.name.trim() || !promoForm.launchDate) return;
    // Only the fields the form actually edits — never forward whatever else happens to be
    // sitting on promoForm (e.g. createdBy/createdAt, which older promotions may not have).
    const { id, name, launchDate, endDate, description } = promoForm;
    const data = { name, launchDate, endDate, description };
    try {
      if (id) {
        await saveExistingPromotion(id, data);
      } else {
        const newId = await createPromotion(data);
        setActivePromoId(newId);
      }
    } catch (err) {
      window.alert('Could not save this promotion: ' + err.message);
      return;
    }
    setPromoModal(false);
    setPromoForm(null);
  }

    try {
      await deletePromotion(promoForm.id, promoForm.name);

      return;

    setActivePromoId(null);
    setPromoModal(false);
    setPromoForm(null);

  function renderTimelineSection(cfg) {
    const dayWidth = isMobile ? 22 : 34;

    const range = computeRange(cfg.items, cfg.getRangeDates || cfg.getDates);
    const ticks = monthTicks(range.min, range.max);

      Modal,
      { title: taskForm.id ? 'Edit task' : 'New task', onClose: () => { setTaskModal(false); setTaskForm(null); } },
      e(Field, { label: 'Team' }, e('select', { style: inputStyle, value: taskForm.team, onChange: (ev) => setTaskForm({ ...taskForm, team: ev.target.value }) }, TEAMS.map((t) => e('option', { key: t.id, value: t.id }, t.label)))),
      e(Field, { label: 'Activity type' }, e('select', { style: inputStyle, value: taskForm.type, onChange: (ev) => setTaskForm({ ...taskForm, type: ev.target.value }) }, TYPES.map((t) => e('option', { key: t.id, value: t.id }, t.label)))),
      e(Field, { label: taskForm.status === 'Reports' ? 'Result headline' : 'Task' }, e('input', { style: inputStyle, value: taskForm.title, onChange: (ev) => setTaskForm({ ...taskForm, title: ev.target.value }), placeholder: taskForm.status === 'Reports' ? 'e.g. Conversion rate 4.1 percent' : 'e.g. Brief paid social creative' })),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Assignee' }, e('input', { style: inputStyle, value: taskForm.assignee, onChange: (ev) => setTaskForm({ ...taskForm, assignee: ev.target.value }) })),
        e(Field, { label: 'Due date' }, e('input', { type: 'date', style: inputStyle, value: taskForm.due, onChange: (ev) => setTaskForm({ ...taskForm, due: ev.target.value }) }))
      ),
      e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: taskForm.status, onChange: (ev) => setTaskForm({ ...taskForm, status: ev.target.value }) }, STATUSES.map((s) => e('option', { key: s, value: s }, s)))),
      e(Field, { label: taskForm.status === 'Reports' ? 'Detail on performance' : 'Notes' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: taskForm.notes, onChange: (ev) => setTaskForm({ ...taskForm, notes: ev.target.value }), placeholder: taskForm.status === 'Reports' ? 'What happened, key metrics, what to repeat or change next time' : '' })),
      taskForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${taskForm.createdBy || 'unknown'}${taskForm.createdAt ? ' · ' + formatDateTime(taskForm.createdAt) : ''}`,
        taskForm.updatedBy && e('span', null, e('br'), `Last edited by ${taskForm.updatedBy}${taskForm.updatedAt ? ' · ' + formatDateTime(taskForm.updatedAt) : ''}`)
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        taskForm.id ? e('button', { onClick: deleteTaskClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete') : e('span'),
        e('button', { onClick: saveTask, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
      )
    );
  }

  let promoModalEl = null;
  if (promoModal && promoForm) {
    promoModalEl = e(
      Modal,
      { title: promoForm.id ? 'Edit promotion' : 'New promotion', onClose: () => { setPromoModal(false); setPromoForm(null); } },
      e(Field, { label: 'Promotion name' }, e('input', { style: inputStyle, value: promoForm.name, onChange: (ev) => setPromoForm({ ...promoForm, name: ev.target.value }), placeholder: 'e.g. Black Friday Sale' })),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Launch date' }, e('input', { type: 'date', style: inputStyle, value: promoForm.launchDate, onChange: (ev) => setPromoForm({ ...promoForm, launchDate: ev.target.value }) })),
        e(Field, { label: 'End date (optional)' }, e('input', { type: 'date', style: inputStyle, min: promoForm.launchDate || undefined, value: promoForm.endDate || '', onChange: (ev) => setPromoForm({ ...promoForm, endDate: ev.target.value }) }))
      ),
      e(Field, { label: 'Description' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: promoForm.description, onChange: (ev) => setPromoForm({ ...promoForm, description: ev.target.value }), placeholder: "What's the offer and who is it for?" })),
      promoForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${promoForm.createdBy || 'unknown'}${promoForm.createdAt ? ' · ' + formatDateTime(promoForm.createdAt) : ''}`
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        promoForm.id ? e(
          'div',
          { style: { display: 'flex', gap: '1rem' } },
          e('button', { onClick: toggleArchivePromo, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, promoForm.archived ? 'Unarchive' : 'Archive'),
          e('button', { onClick: deletePromoClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete promotion')
        ) : e('span'),
        e('button', { onClick: savePromo, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, promoForm.id ? 'Save changes' : 'Create promotion')
      )
    );
  }

  let emailModalEl = null;
  if (emailModal && emailForm) {
    emailModalEl = e(
      Modal,
      { title: emailForm.id ? 'Edit email' : 'New email', onClose: () => { setEmailModal(false); setEmailForm(null); } },
      e(Field, { label: 'Subject' }, e('input', { style: inputStyle, value: emailForm.subject, onChange: (ev) => setEmailForm({ ...emailForm, subject: ev.target.value }), placeholder: 'e.g. This week: cabin upgrade offers' })),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Send date' }, e('input', { type: 'date', style: inputStyle, value: emailForm.sendDate, onChange: (ev) => setEmailForm({ ...emailForm, sendDate: ev.target.value }) })),
        e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: emailForm.status, onChange: (ev) => setEmailForm({ ...emailForm, status: ev.target.value }) }, EMAIL_STATUSES.map((s) => e('option', { key: s, value: s }, s))))
      ),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Assignee' }, e('input', { style: inputStyle, value: emailForm.assignee, onChange: (ev) => setEmailForm({ ...emailForm, assignee: ev.target.value }) })),
        e(Field, { label: 'Related promotion (optional)' }, e(
          'select',
          { style: inputStyle, value: emailForm.relatedPromoId || '', onChange: (ev) => setEmailForm({ ...emailForm, relatedPromoId: ev.target.value }) },
          e('option', { value: '' }, 'None'),
          promotions.map((p) => e('option', { key: p.id, value: p.id }, p.name))
        ))
      ),
      e(Field, { label: 'HubSpot link (optional)' }, e('input', { style: inputStyle, value: emailForm.hubspotLink || '', onChange: (ev) => setEmailForm({ ...emailForm, hubspotLink: ev.target.value }), placeholder: 'https://app.hubspot.com/...' })),
      e(Field, { label: emailForm.status === 'Reported' ? 'Performance notes' : 'Notes' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: emailForm.notes, onChange: (ev) => setEmailForm({ ...emailForm, notes: ev.target.value }), placeholder: emailForm.status === 'Reported' ? 'Open rate, click rate, bookings attributed, what to repeat or change' : '' })),
      emailForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${emailForm.createdBy || 'unknown'}${emailForm.createdAt ? ' · ' + formatDateTime(emailForm.createdAt) : ''}`,
        emailForm.updatedBy && e('span', null, e('br'), `Last edited by ${emailForm.updatedBy}${emailForm.updatedAt ? ' · ' + formatDateTime(emailForm.updatedAt) : ''}`)
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        emailForm.id ? e('button', { onClick: deleteEmailClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete') : e('span'),
        e('button', { onClick: saveEmail, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
      )
    );
  }

  let testModalEl = null;
  if (testModal && testForm) {
    const config = findTrackerConfig(testForm.__collection);
    testModalEl = e(
      Modal,
      { title: testForm.id ? `Edit test` : `New test`, onClose: () => { setTestModal(false); setTestForm(null); } },
      ...config.fields.map((f) => e(Field, { key: f.key, label: f.label }, renderTestFieldInput(f, testForm[f.key], (v) => setTestForm({ ...testForm, [f.key]: v })))),
      e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: testForm.status, onChange: (ev) => setTestForm({ ...testForm, status: ev.target.value }) }, config.statuses.map((s) => e('option', { key: s, value: s }, s)))),
      testForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${testForm.createdBy || 'unknown'}${testForm.createdAt ? ' · ' + formatDateTime(testForm.createdAt) : ''}`,
        testForm.updatedBy && e('span', null, e('br'), `Last edited by ${testForm.updatedBy}${testForm.updatedAt ? ' · ' + formatDateTime(testForm.updatedAt) : ''}`)
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        testForm.id ? e('button', { onClick: deleteTestClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete') : e('span'),
        e('button', { onClick: saveTest, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
      )
    );
  }

  return e(
    'div',
    { style: { width: '100%', minHeight: '100vh', background: 'var(--bg)', fontFamily: 'Arial, Helvetica, sans-serif' } },
    header,
    sectionTabs,
    subTabs,
    overviewSection,
    boardSection,
    timelineSection,
    emailsSection,
    testTrackerSection,
    activitySection,
    taskModalEl,
    promoModalEl,
    emailModalEl,
    testModalEl
  );
}

function App() {
  const user = useAuthUser();
  const email = user ? user.email : null;
  const allowed = useAllowed(email);

  if (user === undefined) return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking sign-in…'));
  if (user === null) return e(SignInScreen);
  if (allowed === null) return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking access…'));
  if (allowed === false) return e(DeniedScreen, { user });
  return e(PromotionPlanner, { user });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
