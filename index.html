      );

      function renderCell(team, status, minHeight) {
        const cellTasks = activePromo.tasks.filter((t) => t.team === team.id && t.status === status);
        const cards = cellTasks.map((task) => {
          const type = TYPES.find((t) => t.id === task.type);
          const dim = activeFilters.size > 0 && !activeFilters.has(task.type);
          return e(
            'div',
            {
              key: task.id,
              draggable: canEdit,
              onDragStart: () => setDraggedTaskId(task.id),
              onDragEnd: () => setDraggedTaskId(null),
              onClick: () => openEditTask(task),
              className: `task-card${draggedTaskId === task.id ? ' dragging' : ''}`,
              style: { cursor: 'pointer', background: 'var(--surface)', borderRadius: '0.5rem', padding: '0.75rem', opacity: dim ? 0.3 : 1, border: '1px solid var(--border)', borderLeftWidth: '3px', borderLeftColor: team.color, borderLeftStyle: 'solid' },
            },
            e('div', { style: { fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem', color: PURPLE_TEXT } }, type ? type.label : task.type),
            e('div', { style: { fontSize: '0.875rem', color: 'var(--text-primary)', lineHeight: 1.35 } }, task.title),
            status === 'Reports' && task.notes && e('div', { style: { fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '0.25rem', lineHeight: 1.35 } }, task.notes),
            e(
              'div',
              { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '0.5rem' } },
              e('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, task.assignee || 'Unassigned'),
              e('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, task.due ? formatDate(task.due) : '')
            )
          );
        });
        return e(
          'div',
          {
            key: status,
            onDragOver: (ev) => ev.preventDefault(),
            onDrop: () => handleDrop(team.id, status),
            style: { borderRadius: '0.5rem', padding: '0.875rem', display: 'flex', flexDirection: 'column', gap: '0.75rem', background: 'var(--surface-alt)', minHeight: minHeight || '116px' },
          },
          ...cards,
          canEdit && e('button', { onClick: () => openNewTask(team.id, status), style: { fontSize: '0.75rem', color: 'var(--text-muted)', textAlign: 'left', padding: '0 0.25rem', marginTop: 'auto', background: 'none', border: 'none', cursor: 'pointer' } }, status === 'Reports' ? '+ Add result' : '+ Add task')
        );
      }

      let board;
      if (isMobile) {
        // A grid this wide doesn't fit a phone screen — stack team sections, each with its
        // statuses listed vertically instead of laid out as columns.
        board = e(
          'div',
          null,
          TEAMS.map((team) => e(
            'div',
            { key: team.id, style: { marginBottom: '1.5rem' } },
            e('div', { style: { fontSize: '0.875rem', fontWeight: 600, padding: '0.5rem 0.75rem', borderRadius: '0.5rem', background: `rgba(${team.rgb}, 0.16)`, color: team.color, marginBottom: '0.75rem' } }, team.label),
            STATUSES.map((status) => e(
              'div',
              { key: status, style: { marginBottom: '0.75rem' } },
              e('div', { style: { fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '0.375rem' } }, status),
              renderCell(team, status, '56px')
            ))
          ))
        );
      } else {
        const gridHeader = [e('div', { key: 'blank' })].concat(
          STATUSES.map((s) => e('div', { key: s, style: { fontSize: '0.875rem', fontWeight: 600, padding: '0 0.5rem 0.25rem', color: 'var(--text-muted)' } }, s))
        );
        const gridRows = TEAMS.map((team) => {
          const teamCell = e(
            'div',
            { key: `${team.id}-label`, style: { display: 'flex', alignItems: 'flex-start', paddingTop: '0.25rem', paddingRight: '0.5rem' } },
            e('span', { style: { fontSize: '0.875rem', fontWeight: 600, padding: '0.5rem 0.75rem', borderRadius: '0.5rem', width: '100%', background: `rgba(${team.rgb}, 0.16)`, color: team.color } }, team.label)
          );
          const statusCells = STATUSES.map((status) => renderCell(team, status));
          return e(React.Fragment, { key: team.id }, teamCell, ...statusCells);
        });
        board = e('div', { style: { display: 'grid', gap: '0.625rem', gridTemplateColumns: '140px repeat(5, 1fr)' } }, ...gridHeader, ...gridRows);
      }

      // "Linked work" — Paid Media Tests, CRO/UX Tests, and Emails that named this promotion as
      // their `relatedPromoId`. These are the literal same records shown on their own team's
      // board, not copies, so editing one here or there is the same write — nothing to keep in
      // sync. A test/email doesn't have to be linked to a promotion at all (most Acquisition/CRO
      // work is standalone, ongoing experimentation), so this only shows what's actually tied here.
      const linkedPaid = (paidTests || []).filter((t) => t.relatedPromoId === activePromo.id);
      const linkedCro = (croTests || []).filter((t) => t.relatedPromoId === activePromo.id);
      const linkedEmails = (emails || []).filter((em) => em.relatedPromoId === activePromo.id);
      const linkedItems = [
        ...linkedPaid.map((t) => ({ id: `linked-paid-${t.id}`, kind: ROLLUP_KINDS.paid, name: t.name, status: t.status, onOpen: () => openEditTest(TEST_TRACKERS.paid, t) })),
        ...linkedCro.map((t) => ({ id: `linked-cro-${t.id}`, kind: ROLLUP_KINDS.cro, name: t.name, status: t.status, onOpen: () => openEditTest(TEST_TRACKERS.cro, t) })),
        ...linkedEmails.map((em) => ({ id: `linked-email-${em.id}`, kind: ROLLUP_KINDS.email, name: em.subject, status: em.status, onOpen: () => openEditEmail(em) })),
      ];
      const linkAddButtonStyle = { fontSize: '0.75rem', padding: '0.25rem 0.625rem', borderRadius: '0.5rem', background: 'var(--surface)', color: 'var(--text-secondary)', border: '1px solid var(--border)', cursor: 'pointer' };
      const linkedWorkSection = e(
        'div',
        { style: { marginTop: '1.5rem', paddingTop: '1.25rem', borderTop: '1px solid var(--border)' } },
        e(
          'div',
          { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem', marginBottom: '0.75rem' } },
          e('h3', { className: 'font-display', style: { fontSize: '1rem', color: PURPLE_DARK, margin: 0 } }, 'Linked work'),
          e(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: '0.5rem' } },
            canEdit && e('button', { onClick: () => openNewTest(TEST_TRACKERS.paid, undefined, { relatedPromoId: activePromo.id }), style: linkAddButtonStyle }, '+ Paid Media Test'),
            canEdit && e('button', { onClick: () => openNewTest(TEST_TRACKERS.cro, undefined, { relatedPromoId: activePromo.id }), style: linkAddButtonStyle }, '+ CRO/UX Test'),
            canEdit && e('button', { onClick: () => openNewEmail(EMAIL_STATUSES[0], '', activePromo.id), style: linkAddButtonStyle }, '+ Email')
          )
        ),
        linkedItems.length === 0
          ? e('p', { style: { fontSize: '0.8125rem', color: 'var(--text-muted)' } }, 'Nothing from Acquisition, Retention, or Website linked to this promotion yet.')
          : e(
              'div',
              { style: { display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
              linkedItems.map((it) => e(
                'div',
                {
                  key: it.id,
                  role: 'button',
                  tabIndex: 0,
                  onClick: it.onOpen,
                  onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); it.onOpen(); } },
                  style: { cursor: 'pointer', background: 'var(--surface)', borderRadius: '0.5rem', padding: '0.625rem 0.75rem', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem' },
                },
                e(
                  'div',
                  { style: { display: 'flex', alignItems: 'center', gap: '0.5rem', minWidth: 0 } },
                  e('span', { style: { fontSize: '0.6875rem', padding: '0.125rem 0.5rem', borderRadius: '999px', background: it.kind.bg, color: it.kind.color, fontWeight: 600, flexShrink: 0 } }, it.kind.label),
                  e('span', { style: { fontSize: '0.875rem', color: PURPLE_DARK, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, it.name)
                ),
                e('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', flexShrink: 0 } }, it.status)
              ))
            )
      );

      promoDetail = e(
        'div',
        { style: { padding: isMobile ? '1rem' : '1.5rem 2rem' } },
        e(
          'div',
          { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'flex-start', justifyContent: 'space-between', gap: '0.75rem', marginBottom: '1.25rem' } },
          e(
            'div',
            null,
            e(
              'div',
              { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '0.625rem' } },
              e('h2', { className: 'font-display', style: { fontSize: '1.25rem', color: PURPLE_DARK, margin: 0 } }, activePromo.name),
              activePromo.archived && e('span', { style: { fontSize: '0.6875rem', padding: '0.125rem 0.5rem', borderRadius: '999px', background: 'var(--surface-alt)', color: 'var(--text-muted)' } }, 'Archived'),
              e('button', { onClick: () => openEditPromo(activePromo), style: { fontSize: '0.75rem', color: 'var(--text-muted)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 } }, 'Edit'),
              canEdit && e('button', { onClick: archiveActivePromoClick, style: { fontSize: '0.75rem', color: 'var(--text-muted)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 } }, activePromo.archived ? 'Unarchive' : 'Archive')
            ),
            activePromo.description && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.25rem', maxWidth: '36rem' } }, activePromo.description)
          ),
          e(
            'div',
            { style: { textAlign: isMobile ? 'left' : 'right', flexShrink: 0, marginLeft: isMobile ? 0 : '1rem' } },
            e(
              'div',
              { style: { display: 'flex', gap: '1.25rem', justifyContent: isMobile ? 'flex-start' : 'flex-end' } },
              e(
                'div',
                null,
                e('div', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, 'Launch date'),
                e('div', { style: { fontSize: '0.875rem', fontWeight: 600, color: PURPLE_DARK } }, formatDate(activePromo.launchDate))
              ),
              activePromo.endDate && e(
                'div',
                null,
                e('div', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, 'End date'),
                e('div', { style: { fontSize: '0.875rem', fontWeight: 600, color: PURPLE_DARK } }, formatDate(activePromo.endDate))
              )
            ),
            promoStatusText && e('div', { style: { fontSize: '0.75rem', marginTop: '0.25rem', color: promoStatusColor } }, promoStatusText)
          )
        ),
        taskErrors[activePromo.id] && e('p', { style: { fontSize: '0.8125rem', color: 'var(--danger)', marginBottom: '1rem' } }, `Couldn't load tasks for this promotion: ${taskErrors[activePromo.id]}. What's shown below may be missing cards.`),
        typeFilters,
        board,
        linkedWorkSection,
        e(
          'div',
          { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem', marginTop: '1.5rem' } },
          e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, isMobile ? "This board is shared — everyone who opens it sees and edits the same data, live. Tap a task to edit or move it." : "This board is shared — everyone who opens it sees and edits the same data, live. Drag cards between columns, or click one to edit."),
          e(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: '0.5rem', flexShrink: 0 } },
            e('button', {
              onClick: () => exportPromoTasksCSV(activePromo),
              style: { fontSize: '0.75rem', padding: '0.25rem 0.625rem', borderRadius: '0.5rem', background: 'var(--surface)', color: 'var(--text-secondary)', border: '1px solid var(--border)', cursor: 'pointer' },
            }, 'Export CSV'),
            e('button', {
              onClick: () => exportPromoDatesICS(activePromo),
              title: 'Launch/end dates — import into Outlook, Google Calendar, or Apple Calendar',
              style: { fontSize: '0.75rem', padding: '0.25rem 0.625rem', borderRadius: '0.5rem', background: 'var(--surface)', color: 'var(--text-secondary)', border: '1px solid var(--border)', cursor: 'pointer' },
            }, 'Export .ics')
          )
        )
      );
    }

    boardSection = e(React.Fragment, null, promoTabs, promoDetail);
  }

  // Generic timeline renderer shared by Promotions, Paid Media, and CRO/UX — each just
  // supplies its own items/date-getter/labels. The visual mechanics (frozen name column,
  // fixed day-width scale, drag-to-pan, today line, prep vs. live bar segments) are identical.
  function renderTimelineSection(cfg) {
    const dayWidth = isMobile ? 22 : 34;
    const labelWidth = isMobile ? 104 : 168;
    const range = computeRange(cfg.items, cfg.getRangeDates || cfg.getDates);
    const ticks = monthTicks(range.min, range.max);
    const today = new Date();
    const contentWidth = Math.max(dayOffsetPx(range.max, range.min, dayWidth), 1);
    const todayLeft = dayOffsetPx(today, range.min, dayWidth);
    const labelCellStyle = { position: 'sticky', left: 0, zIndex: 3, flexShrink: 0, width: `${labelWidth}px`, background: 'var(--bg)', paddingRight: '0.75rem' };

    const tickEls = ticks.map((t) => e('div', { key: t.toISOString(), style: { position: 'absolute', fontSize: '0.75rem', color: 'var(--text-muted)', left: `${dayOffsetPx(t, range.min, dayWidth)}px` } }, t.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })));

    const rows = cfg.items.map((item) => {
      const { start, launch, end, hasRealEnd } = cfg.getDates(item);
      const name = cfg.getName(item);
      const startLeft = dayOffsetPx(start, range.min, dayWidth);
      const launchLeft = dayOffsetPx(launch, range.min, dayWidth);
      const endLeft = dayOffsetPx(end, range.min, dayWidth);
      return e(
        'div',
        {
          key: item.id,
          role: 'button',
          tabIndex: 0,
          onClick: () => cfg.onOpenItem(item),
          onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); cfg.onOpenItem(item); } },
          style: { display: 'flex', alignItems: 'center', marginBottom: '1.5rem', cursor: 'pointer' },
        },
        e(
          'div',
          { style: labelCellStyle, title: name },
          e('div', { style: { fontSize: '0.875rem', fontWeight: 600, color: PURPLE_DARK, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, name),
          e(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: '0.25rem', marginTop: '0.25rem' } },
            cfg.getKind && (() => {
              const kind = cfg.getKind(item);
              return kind && e('span', { style: { fontSize: '0.6875rem', padding: '0.125rem 0.5rem', borderRadius: '999px', background: kind.bg, color: kind.color, fontWeight: 600 } }, kind.label);
            })(),
            e('span', { style: { fontSize: '0.75rem', padding: '0.125rem 0.5rem', borderRadius: '999px', background: 'var(--surface-alt)', color: 'var(--text-secondary)' } }, cfg.getStage(item))
          )
        ),
        e(
          'div',
          { style: { position: 'relative', height: '24px', width: `${contentWidth}px`, flexShrink: 0, borderRadius: '999px', background: 'var(--surface-alt)' } },
          e('div', { style: { position: 'absolute', height: '100%', borderRadius: '999px', left: `${startLeft}px`, width: `${Math.max(launchLeft - startLeft, 4)}px`, background: PURPLE_LIGHT } }),
          e('div', { style: { position: 'absolute', height: '100%', borderRadius: '999px', left: `${launchLeft}px`, width: `${Math.max(endLeft - launchLeft, 4)}px`, background: PURPLE } }),
          e('div', { title: `${cfg.launchTitle} ${formatDate(launch)}`, style: { position: 'absolute', borderRadius: '999px', left: `${launchLeft - 5}px`, top: '-3px', width: '12px', height: '12px', background: PURPLE_DARK, border: '2px solid var(--bg)' } }),
          hasRealEnd && e('div', { title: `${cfg.endTitle} ${formatDate(end)}`, style: { position: 'absolute', borderRadius: '999px', left: `${endLeft - 5}px`, top: '-3px', width: '12px', height: '12px', background: 'var(--surface)', border: `2px solid ${PURPLE_DARK}`, boxSizing: 'border-box' } })
        )
      );
    });

    return e(
      'div',
      { style: { padding: isMobile ? '1.5rem 1rem 1rem' : '1.5rem 2rem' } },
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.75rem' } },
        e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, 'Drag left or right to see items outside the current window. The name stays put.'),
        e('button', {
          onClick: () => { if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = todayLeft - 80; },
          style: { fontSize: '0.75rem', color: PURPLE_TEXT, background: 'none', border: 'none', cursor: 'pointer', flexShrink: 0, marginLeft: '1rem' },
        }, 'Jump to today'),
      ),
      e(
        'div',
        { ref: timelineScrollRef, style: { overflowX: 'auto', cursor: 'grab', paddingBottom: '0.5rem' } },
        e(
          'div',
          { style: { position: 'relative', width: `${labelWidth + contentWidth}px` } },
          e(
            'div',
            { style: { display: 'flex', marginBottom: '1.5rem' } },
            e('div', { style: { flexShrink: 0, width: `${labelWidth}px` } }),
            e('div', { style: { position: 'relative', width: `${contentWidth}px`, flexShrink: 0, height: '18px' } }, ...tickEls)
          ),
          e(
            'div',
            { style: { position: 'relative', paddingTop: '4px' } },
            e('div', { style: { position: 'absolute', top: 0, bottom: 0, width: '1px', left: `${labelWidth + todayLeft}px`, background: TODAY_COLOR, zIndex: 1 } }),
            rows.length ? rows : e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, cfg.emptyLabel)
          )
        )
      ),
      e(
        'div',
        { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '1rem', marginTop: '1rem', fontSize: '0.75rem', color: 'var(--text-muted)' } },
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '12px', height: '12px', borderRadius: '999px', background: PURPLE_LIGHT } }), cfg.prepLabel),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '12px', height: '12px', borderRadius: '999px', background: PURPLE } }), cfg.liveLabel),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '999px', background: PURPLE_DARK } }), cfg.launchTitle),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '999px', background: 'var(--surface)', border: `2px solid ${PURPLE_DARK}`, boxSizing: 'border-box' } }), cfg.endTitle),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '1px', height: '12px', background: TODAY_COLOR } }), 'Today')
      ),
      e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '1.5rem' } }, cfg.footerNote)
    );
  }

  let myWorkSection = null;
  if (section === 'mywork') {
    const todayKey = toDateKey(new Date());
    const todayItems = myWorkItems.filter((it) => it.due === todayKey);
    const laterItems = myWorkItems.filter((it) => it.due !== todayKey);

    function renderMyWorkItem(it, highlight) {
      const overdue = it.due && it.due !== todayKey && daysUntil(it.due) < 0;
      return e(
        'div',
        {
          key: it.id,
          role: 'button',
          tabIndex: 0,
          onClick: it.onOpen,
          onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); it.onOpen(); } },
          style: { cursor: 'pointer', background: highlight ? 'var(--surface-tint)' : 'var(--surface)', borderRadius: '0.5rem', padding: '0.75rem', border: `1px solid ${highlight ? PURPLE : 'var(--border)'}` },
        },
        e(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem' } },
          e('div', { style: { fontSize: '0.875rem', fontWeight: 600, color: PURPLE_DARK } }, it.title),
          e('span', { style: { fontSize: '0.75rem', color: overdue ? 'var(--danger)' : 'var(--text-muted)', flexShrink: 0, whiteSpace: 'nowrap' } }, it.due ? formatDate(it.due) : 'No date')
        ),
        e(
          'div',
          { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '0.375rem', marginTop: '0.375rem' } },
          e('span', { style: { fontSize: '0.6875rem', padding: '0.125rem 0.5rem', borderRadius: '999px', background: it.badge.bg, color: it.badge.color, fontWeight: 600 } }, it.badge.label),
          e('span', { style: { fontSize: '0.75rem', color: 'var(--text-secondary)' } }, it.context),
          e('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, `· ${it.status}`)
        )
      );
    }

    myWorkSection = e(
      'div',
      { style: { padding: isMobile ? '1.5rem 1rem 1rem' : '1.5rem 2rem', maxWidth: '48rem' } },
      e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '1rem' } }, `Everything assigned to ${actorName} across Promotions, Emails, Paid Media, and CRO/UX — soonest first.`),
      myWorkItems.length === 0 && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Nothing assigned to you right now.'),
      todayItems.length > 0 && e(
        'div',
        { style: { marginBottom: '1.25rem' } },
        e('h3', { className: 'font-display', style: { fontSize: '0.9375rem', color: PURPLE_DARK, margin: '0 0 0.625rem' } }, `Due today (${todayItems.length})`),
        e('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.625rem' } }, todayItems.map((it) => renderMyWorkItem(it, true)))
      ),
      laterItems.length > 0 && e(
        'div',
        null,
        todayItems.length > 0 && e('h3', { className: 'font-display', style: { fontSize: '0.9375rem', color: PURPLE_DARK, margin: '0 0 0.625rem' } }, 'Everything else'),
        e('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.625rem' } }, laterItems.map((it) => renderMyWorkItem(it, false)))
      )
    );
  }

  let overviewSection = null;
  if (section === 'overview') {
    const filteredRollupItems = rollupItems.filter((it) => {
      if (overviewKinds.size > 0 && !overviewKinds.has(it.kind)) return false;
      if (overviewAssignee && !it.assignees.includes(overviewAssignee)) return false;

        e(Field, { label: taskForm.status === 'Reports' ? 'Detail on performance' : 'Notes' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: taskForm.notes, onChange: (ev) => setTaskForm({ ...taskForm, notes: ev.target.value }), placeholder: taskForm.status === 'Reports' ? 'What happened, key metrics, what to repeat or change next time' : '' })),
        taskForm.id && e(
          'p',
          { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
          `Created by ${taskForm.createdBy || 'unknown'}${taskForm.createdAt ? ' · ' + formatDateTime(taskForm.createdAt) : ''}`,
          taskForm.updatedBy && e('span', null, e('br'), `Last edited by ${taskForm.updatedBy}${taskForm.updatedAt ? ' · ' + formatDateTime(taskForm.updatedAt) : ''}`)
        ),
        e(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
          taskForm.id ? e(
            'div',
            { style: { display: 'flex', gap: '1rem' } },
            e('button', { onClick: duplicateTaskClick, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Duplicate'),
            e('button', { onClick: deleteTaskClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete')
          ) : e('span'),
          e('button', { onClick: saveTask, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
        )
      ),
      taskForm.id && e(HistorySection, { entries: taskHistory.entries, error: taskHistory.error }),
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },
        taskForm.id && activePromo && e(AttachmentsSection, { pathSegments: ['promotions', activePromo.id, 'tasks', taskForm.id, 'attachments'], currentUserEmail: user.email, currentUserName: actorName, pushToast }),
        taskForm.id && activePromo && e(CommentsThread, { pathSegments: ['promotions', activePromo.id, 'tasks', taskForm.id, 'comments'], currentUserEmail: user.email, currentUserName: actorName, users, pushToast })
      )
    );
  }

  let promoModalEl = null;
  if (promoModal && promoForm) {
    promoModalEl = e(
      Modal,
      { title: promoForm.id ? 'Edit promotion' : 'New promotion', onClose: () => { setPromoModal(false); setPromoForm(null); setSelectedTemplateId(''); } },
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },
        !promoForm.id && promoTemplates && promoTemplates.length > 0 && e(Field, { label: 'Start from a template (optional)' }, e(
          'select',
          { style: inputStyle, value: selectedTemplateId, onChange: (ev) => applyTemplate(ev.target.value) },
          e('option', { value: '' }, 'Start blank'),
          promoTemplates.map((t) => e('option', { key: t.id, value: t.id }, `${t.name} (${(t.tasks || []).length} task${(t.tasks || []).length === 1 ? '' : 's'})`))
        )),
        e(Field, { label: 'Promotion name', required: true }, e('input', { style: inputStyle, value: promoForm.name, onChange: (ev) => setPromoForm({ ...promoForm, name: ev.target.value }), placeholder: 'e.g. Black Friday Sale' })),
        e(
          'div',
          { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
          e(Field, { label: 'Launch date', required: true }, e('input', { type: 'date', style: inputStyle, value: promoForm.launchDate, onChange: (ev) => setPromoForm({ ...promoForm, launchDate: ev.target.value }) })),
          e(Field, { label: 'End date (optional)' }, e('input', { type: 'date', style: inputStyle, min: promoForm.launchDate || undefined, value: promoForm.endDate || '', onChange: (ev) => setPromoForm({ ...promoForm, endDate: ev.target.value }) }))
        ),
        e(Field, { label: 'Description' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: promoForm.description, onChange: (ev) => setPromoForm({ ...promoForm, description: ev.target.value }), placeholder: "What's the offer and who is it for?" })),
        promoForm.id && e(
          'p',
          { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
          `Created by ${promoForm.createdBy || 'unknown'}${promoForm.createdAt ? ' · ' + formatDateTime(promoForm.createdAt) : ''}`
        ),
        e(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
          promoForm.id ? e(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: '1rem' } },
            e('button', { onClick: duplicatePromoClick, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Duplicate'),
            e('button', { onClick: saveAsTemplateClick, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Save as template'),
            e('button', { onClick: toggleArchivePromo, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, promoForm.archived ? 'Unarchive' : 'Archive'),
            e('button', { onClick: deletePromoClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete promotion')
          ) : e('span'),
          e('button', { onClick: savePromo, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, promoForm.id ? 'Save changes' : 'Create promotion')
        )
      ),
      promoForm.id && e(HistorySection, { entries: promoHistory.entries, error: promoHistory.error }),
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },

        promoForm.id && e(CommentsThread, { pathSegments: ['promotions', promoForm.id, 'comments'], currentUserEmail: user.email, currentUserName: actorName, users, pushToast })
      )
    );
  }

  let emailModalEl = null;
  if (emailModal && emailForm) {
    emailModalEl = e(
      Modal,
      { title: emailForm.id ? 'Edit email' : 'New email', onClose: () => { setEmailModal(false); setEmailForm(null); } },
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },
        e(Field, { label: 'Subject', required: true }, e('input', { style: inputStyle, value: emailForm.subject, onChange: (ev) => setEmailForm({ ...emailForm, subject: ev.target.value }), placeholder: 'e.g. This week: cabin upgrade offers' })),
        e(
          'div',
          { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
          e(Field, { label: 'Send date', required: true }, e('input', { type: 'date', style: inputStyle, value: emailForm.sendDate, onChange: (ev) => setEmailForm({ ...emailForm, sendDate: ev.target.value }) })),
          e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: emailForm.status, onChange: (ev) => setEmailForm({ ...emailForm, status: ev.target.value }) }, EMAIL_STATUSES.map((s) => e('option', { key: s, value: s }, s))))
        ),
        e(
          'div',
          { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
          e(Field, { label: 'Assignee' }, renderAssigneeSelect(emailForm.assignee, (v) => setEmailForm({ ...emailForm, assignee: v }), users)),

            'select',
            { style: inputStyle, value: emailForm.relatedPromoId || '', onChange: (ev) => setEmailForm({ ...emailForm, relatedPromoId: ev.target.value }) },
            e('option', { value: '' }, 'None'),
            promotions.map((p) => e('option', { key: p.id, value: p.id }, p.archived ? `${p.name} (archived)` : p.name))
          ))
        ),
        e(Field, { label: 'HubSpot link (optional)' }, e('input', { style: inputStyle, value: emailForm.hubspotLink || '', onChange: (ev) => setEmailForm({ ...emailForm, hubspotLink: ev.target.value }), placeholder: 'https://app.hubspot.com/...' })),
        e(Field, { label: emailForm.status === 'Reported' ? 'Performance notes' : 'Notes' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: emailForm.notes, onChange: (ev) => setEmailForm({ ...emailForm, notes: ev.target.value }), placeholder: emailForm.status === 'Reported' ? 'Open rate, click rate, bookings attributed, what to repeat or change' : '' })),
        emailForm.id && e(
          'p',
          { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
          `Created by ${emailForm.createdBy || 'unknown'}${emailForm.createdAt ? ' · ' + formatDateTime(emailForm.createdAt) : ''}`,
          emailForm.updatedBy && e('span', null, e('br'), `Last edited by ${emailForm.updatedBy}${emailForm.updatedAt ? ' · ' + formatDateTime(emailForm.updatedAt) : ''}`)
        ),
        e(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
          emailForm.id ? e(
            'div',
            { style: { display: 'flex', gap: '1rem' } },
            e('button', { onClick: duplicateEmailClick, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Duplicate'),
            e('button', { onClick: deleteEmailClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete')
          ) : e('span'),
          e('button', { onClick: saveEmail, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
        )
      ),
      emailForm.id && e(HistorySection, { entries: emailHistory.entries, error: emailHistory.error }),
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },
        emailForm.id && e(AttachmentsSection, { pathSegments: ['emails', emailForm.id, 'attachments'], currentUserEmail: user.email, currentUserName: actorName, pushToast }),
        emailForm.id && e(CommentsThread, { pathSegments: ['emails', emailForm.id, 'comments'], currentUserEmail: user.email, currentUserName: actorName, users, pushToast })
      )
    );
  }

  let testModalEl = null;
  if (testModal && testForm) {
    const config = findTrackerConfig(testForm.__collection);
    testModalEl = e(
      Modal,
      { title: `${testForm.id ? 'Edit' : 'New'} ${config.label.replace(/s$/, '')}`, onClose: () => { setTestModal(false); setTestForm(null); } },

        ...config.fields.map((f) => e(Field, { key: f.key, label: f.label, required: f.required }, renderTestFieldInput(f, testForm[f.key], (v) => setTestForm({ ...testForm, [f.key]: v }), users, promotions))),
        e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: testForm.status, onChange: (ev) => setTestForm({ ...testForm, status: ev.target.value }) }, config.statuses.map((s) => e('option', { key: s, value: s }, s)))),
        testForm.id && e(
          'p',
          { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
          `Created by ${testForm.createdBy || 'unknown'}${testForm.createdAt ? ' · ' + formatDateTime(testForm.createdAt) : ''}`,
          testForm.updatedBy && e('span', null, e('br'), `Last edited by ${testForm.updatedBy}${testForm.updatedAt ? ' · ' + formatDateTime(testForm.updatedAt) : ''}`)
        ),
        e(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
          testForm.id ? e(
            'div',
            { style: { display: 'flex', gap: '1rem' } },
            e('button', { onClick: duplicateTestClick, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Duplicate'),
            e('button', { onClick: deleteTestClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete')
          ) : e('span'),
          e('button', { onClick: saveTest, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
        )
      ),
      testForm.id && e(HistorySection, { entries: testHistory.entries, error: testHistory.error }),
      e(
        'fieldset',
        { disabled: !canEdit, style: fieldsetResetStyle },
        testForm.id && e(AttachmentsSection, { pathSegments: [testForm.__collection, testForm.id, 'attachments'], currentUserEmail: user.email, currentUserName: actorName, pushToast }),
        testForm.id && e(CommentsThread, { pathSegments: [testForm.__collection, testForm.id, 'comments'], currentUserEmail: user.email, currentUserName: actorName, users, pushToast })
      )
    );
  }

  // Surfaced separately from each section's own "Loading…"/"nothing here" text, so a genuine
  // load failure (offline, a permissions problem) never looks identical to an empty board.
  const dataErrors = [
    promoDocsError && 'promotions',
    emailsError && 'emails',
    paidTestsError && 'paid media tests',
    croTestsError && 'CRO/UX tests',
    promoTemplatesError && 'promotion templates',
    usersError && 'the team directory',
    Object.keys(taskErrors).length > 0 && (Object.keys(taskErrors).length === 1 ? 'one promotion\'s tasks' : `${Object.keys(taskErrors).length} promotions' tasks`),
  ].filter(Boolean);
  const dataErrorBanner = dataErrors.length > 0 && e(
    'div',
    { style: { padding: '0.625rem 2rem', background: 'var(--danger)', color: '#fff', fontSize: '0.8125rem', textAlign: 'center' } },
    `Couldn't load ${dataErrors.join(', ')} — you may be offline, or something's misconfigured. What you see below may be incomplete.`
  );

  return e(
    'div',
    { style: { width: '100%', minHeight: '100vh', background: 'var(--bg)', fontFamily: 'Arial, Helvetica, sans-serif' } },
    header,
    dataErrorBanner,
    sectionTabs,
    boardSwitcher,
    subTabs,
    myWorkSection,
    overviewSection,
    statsSection,
    boardSection,
    timelineSection,
    emailsSection,
    testTrackerSection,
    activitySection,
    section === 'admin' && e(AdminSection, { currentUserEmail: user.email, users, pushToast, isMobile }),
    taskModalEl,
    promoModalEl,
    emailModalEl,
    testModalEl,
    templatesModalOpen && e(TemplatesModal, { templates: promoTemplates || [], onClose: () => setTemplatesModalOpen(false), onRename: renameTemplateClick, onDelete: deleteTemplateClick, canEdit }),
    e(ToastStack, { toasts, onDismiss: dismissToast })
  );
}

function AccessErrorScreen({ message, onRetry }) {
  return e(
    CenteredMessage,
    null,
    e('h1', { className: 'font-display', style: { fontSize: '1.5rem', color: PURPLE_DARK, margin: 0 } }, "Couldn't check your access"),
    e('p', { style: { fontSize: '0.875rem', color: 'var(--text-secondary)', maxWidth: '24rem' } }, message || "Something went wrong reaching the board's access list. This is usually a connection problem, not a permissions one."),
    e('button', {
      onClick: onRetry,
      style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', background: PURPLE, fontSize: '0.875rem', fontWeight: 500, border: 'none', cursor: 'pointer' },
    }, 'Try again')
  );
}

function App() {
  const user = useAuthUser();
  const email = user ? user.email : null;
  const [retryKey, setRetryKey] = useState(0);
  const allowed = useAllowed(email, retryKey);

  if (user === undefined) return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking sign-in…'));
  if (user === null) return e(SignInScreen);
  if (allowed.state === 'checking') return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking access…'));
  if (allowed.state === 'error') return e(AccessErrorScreen, { message: allowed.message, onRetry: () => setRetryKey((k) => k + 1) });
  if (allowed.state === 'denied') return e(DeniedScreen, { user });
  return e(PromotionPlanner, { user });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
