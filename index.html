  // Applied synchronously, before the CSS below ever paints, so a saved "light" or "dark"
  // choice never flashes the OS-default theme first. No preference stored = follow the OS
  // (the CSS handles that case on its own via prefers-color-scheme).
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (err) {}
  })();
</script>

function genId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 't' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// What counts as "still open" (worth a reminder) per item type — a task marked Live/Reports,
// an email that's Sent/Reported, or a test that's already Live/Analyzing/Concluded has moved
// past the point its due date was tracking, so a past due date there isn't a problem anymore.
function isOpenForReminder(type, status) {
  if (type === 'task') return status !== 'Live' && status !== 'Reports';
  if (type === 'email') return status !== 'Sent' && status !== 'Reported';
  if (type === 'paid') return status === 'Planned';
  if (type === 'cro') return status === 'Idea';
  return true;
}

// --- Calendar month-grid helpers (all local-time; never round-trips sendDate strings
// through `new Date()`, so there's no UTC/local day-shift risk when matching them up). ---
function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

function addMonths(d, n) {
  return new Date(d.getFullYear(), d.getMonth() + n, 1);
}

function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 6 weeks (42 days), Monday-start, covering the month plus lead/trail days.
function buildMonthGrid(monthStart) {
  const firstWeekday = (monthStart.getDay() + 6) % 7; // 0 = Monday
  const gridStart = new Date(monthStart);
  gridStart.setDate(monthStart.getDate() - firstWeekday);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    days.push(d);
  }
  return days;
}

  }, [onClose]);

    {

}

// One row in TemplatesModal — local text state so a rename commits on blur/Enter, not on every
// keystroke (that would be a Firestore write per character typed).
function TemplateRow({ template, onRename, onDelete }) {
  const [name, setName] = useState(template.name);
  useEffect(() => { setName(template.name); }, [template.name]);
  function commitRename() {
    const trimmed = name.trim();
    if (trimmed && trimmed !== template.name) onRename(template.id, trimmed);
    else setName(template.name);
  }
  const taskCount = (template.tasks || []).length;
  return e(
    'div',
    { style: { display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.5rem', border: '1px solid var(--border)', borderRadius: '0.5rem' } },
    e('input', {
      style: { ...inputStyle, flex: 1 },
      value: name,
      onChange: (ev) => setName(ev.target.value),
      onBlur: commitRename,
      onKeyDown: (ev) => { if (ev.key === 'Enter') ev.currentTarget.blur(); },
    }),
    e('span', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', flexShrink: 0, whiteSpace: 'nowrap' } }, `${taskCount} task${taskCount === 1 ? '' : 's'}`),
    e('button', {
      onClick: () => onDelete(template.id, template.name),
      style: { fontSize: '0.75rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer', flexShrink: 0 },
    }, 'Delete')
  );
}

// A dropdown of real team members (from the `users` directory), storing their email — a
// reliable key "My work" can filter on, unlike free-typed names. Keeps whatever value is
// already on the record as a selectable option even if it doesn't match anyone in the
// directory (an old free-text name, or someone who hasn't signed in yet), so opening and
// re-saving a card never silently wipes it.
function renderAssigneeSelect(value, onChange, users) {
  const options = (users || []).slice().sort((a, b) => (a.displayName || a.email).localeCompare(b.displayName || b.email));
  const hasCurrent = !value || options.some((u) => u.email === value);

}

// --- Timeline helpers ---
function taskDates(promo) {
  const launch = new Date(promo.launchDate);
  const dueTimes = promo.tasks.map((t) => t.due).filter(Boolean).map((d) => new Date(d).getTime());
  const startTime = dueTimes.length ? Math.min(...dueTimes, launch.getTime()) : launch.getTime() - 14 * 86400000;
  const hasRealEnd = !!promo.endDate;
  const end = hasRealEnd ? new Date(promo.endDate) : new Date(launch.getTime() + 14 * 86400000);
  return {
    start: new Date(startTime),
    launch,
    end,
    hasRealEnd,
    // Reporting wraps up roughly two weeks after the promotion actually ends.
    reportEnd: new Date(end.getTime() + 14 * 86400000),
  };
}

function promoStageLabel(promo) {
  if (!promo.tasks.length) return 'Not started';
  const idx = Math.min(...promo.tasks.map((t) => STATUSES.indexOf(t.status)));
  return STATUSES[idx];
}

// Same {start, launch, end, hasRealEnd} shape as taskDates, for a paidTests/croTests item.
// "Prepping" runs from when the test was logged (createdAt) to its start date; "live testing"
// runs start date to end date (or a 14-day estimate when no end date is set yet).
function testDates(item) {
  const liveStart = new Date(item.startDate);
  const prepStartRaw = item.createdAt && typeof item.createdAt.toDate === 'function' ? item.createdAt.toDate() : liveStart;
  const start = prepStartRaw.getTime() < liveStart.getTime() ? prepStartRaw : liveStart;
  const hasRealEnd = !!item.endDate;
  const end = hasRealEnd ? new Date(item.endDate) : new Date(liveStart.getTime() + 14 * 86400000);
  return { start, launch: liveStart, end, hasRealEnd };
}

// `getDates(item)` returns at least {start, end} — the range that should be visible, padded 5
// days each side. Promotions pass reportEnd as `end` here (room for the Reports stage); tests
// just use their own end/estimate.
function computeRange(items, getDates) {
  const all = [new Date()];
  items.forEach((it) => {
    const { start, end } = getDates(it);
    all.push(start, end);
  });
  const min = new Date(Math.min(...all.map((d) => d.getTime())) - 5 * 86400000);
  const max = new Date(Math.max(...all.map((d) => d.getTime())) + 5 * 86400000);
  return { min, max };
}

const DAY_MS = 86400000;
function dayOffsetPx(date, min, dayWidth) {
  return ((date.getTime() - min.getTime()) / DAY_MS) * dayWidth;
}

function monthTicks(min, max) {
  const ticks = [];
  let cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) {
    ticks.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return ticks;
}

function formatDateTime(ts) {
  if (!ts || typeof ts.toDate !== 'function') return 'just now';
  return ts.toDate().toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// --- CSV export: columns is [{ label, get(row) }], rows is any array of plain objects. ---
function rowsToCSV(rows, columns) {
  const esc = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [columns.map((c) => esc(c.label)).join(',')];
  rows.forEach((row) => lines.push(columns.map((c) => esc(c.get(row))).join(',')));
  return lines.join('\r\n');
}

function downloadBlob(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCSV(filename, rows, columns) {
  // Leading BOM so Excel on Windows renders "£" and accented names correctly instead of
  // mojibake — without it, Excel guesses the file's encoding instead of trusting UTF-8.
  downloadBlob(filename, '﻿' + rowsToCSV(rows, columns), 'text/csv;charset=utf-8;');
}

// --- .ics export: events is [{ uid, title, dateKey ('YYYY-MM-DD'), description }], one
// all-day VEVENT per entry. No BOM here (unlike CSV) — calendar apps don't need the Excel
// workaround, and some strict ICS parsers choke on one.
function icsTimestamp(d) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}

function dateKeyPlusOneDay(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + 1);
  return toDateKey(dt);
}

function escapeICSText(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

function eventsToICS(events) {
  const dtstamp = icsTimestamp(new Date());
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Digital Team Planner//EN', 'CALSCALE:GREGORIAN'];
  events.forEach((ev) => {
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${ev.uid}@digitalteamplanner.local`);
    lines.push(`DTSTAMP:${dtstamp}`);
    lines.push(`DTSTART;VALUE=DATE:${ev.dateKey.replace(/-/g, '')}`);
    lines.push(`DTEND;VALUE=DATE:${dateKeyPlusOneDay(ev.dateKey).replace(/-/g, '')}`);
    lines.push(`SUMMARY:${escapeICSText(ev.title)}`);
    if (ev.description) lines.push(`DESCRIPTION:${escapeICSText(ev.description)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadICS(filename, events) {
  downloadBlob(filename, eventsToICS(events), 'text/calendar;charset=utf-8;');
}

// --- Backend: Firestore, shared with everyone on the allowlist ---
function useOnlineStatus() {
  const [online, setOnline] = useState(typeof navigator === 'undefined' ? true : navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener('online', on);
    window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  return online;
}

// 'light' | 'dark' | 'system' — persisted per-browser in localStorage (this is a personal
// display preference, not shared team data, so it doesn't belong in Firestore). 'system'
// means no stored choice: the CSS's prefers-color-scheme media query decides.
function useTheme() {
  const [theme, setThemeState] = useState(() => {
    try {
      const stored = localStorage.getItem('theme');
      return stored === 'light' || stored === 'dark' ? stored : 'system';
    } catch (err) { return 'system'; }
  });
  function setTheme(next) {
    setThemeState(next);
    try {
      if (next === 'system') localStorage.removeItem('theme');
      else localStorage.setItem('theme', next);
    } catch (err) {}
    if (next === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', next);
  }
  return [theme, setTheme];
}

// Saved Overview filter combos — a personal convenience (like the theme choice), so
// per-browser in localStorage rather than a shared Firestore collection everyone would see.
const SAVED_VIEWS_KEY = 'overviewSavedViews';
function useSavedViews() {
  const [views, setViews] = useState(() => {
    try {
      const raw = localStorage.getItem(SAVED_VIEWS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) { return []; }
  });
  function persist(next) {
    setViews(next);
    try { localStorage.setItem(SAVED_VIEWS_KEY, JSON.stringify(next)); } catch (err) {}
  }
  function saveView(view) { persist([...views, view]); }
  function deleteView(id) { persist(views.filter((v) => v.id !== id)); }
  return { views, saveView, deleteView };
}

const MOBILE_QUERY = '(max-width: 720px)';
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== 'undefined' ? window.matchMedia(MOBILE_QUERY).matches : false));
  useEffect(() => {
    const mq = window.matchMedia(MOBILE_QUERY);
    const handler = (ev) => setIsMobile(ev.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);
  return isMobile;
}

// Click-and-drag panning for a horizontally-scrollable container (touch already scrolls it
// natively). A small movement threshold keeps an ordinary click on something inside it working.
function useDragScroll(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let down = false;
    let dragging = false;
    let startX = 0;
    let startScroll = 0;
    function onDown(ev) {
      down = true;
      dragging = false;
      startX = ev.pageX;
      startScroll = el.scrollLeft;
    }
    function onMove(ev) {
      if (!down) return;
      const dx = ev.pageX - startX;
      if (!dragging && Math.abs(dx) > 4) {
        dragging = true;
        el.style.cursor = 'grabbing';
        el.style.userSelect = 'none';
      }
      if (dragging) {
        ev.preventDefault();
        el.scrollLeft = startScroll - dx;
      }
    }
    function onUp() {
      down = false;
      el.style.cursor = 'grab';
      el.style.userSelect = '';
      if (dragging) {
        // A real drag ending over a row would otherwise still fire that row's click right
        // after this — swallow the one click the browser is about to dispatch.
        const blockClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        window.addEventListener('click', blockClick, { capture: true, once: true });
      }
      dragging = false;
    }
    el.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      el.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [ref]);
}

// Returns { docs, error }: docs is null while loading, an array once loaded (possibly empty).

function useTasksByPromo(promoIds) {
  const [tasksByPromo, setTasksByPromo] = useState({});
  // promoId -> error message, for a promotion whose tasks subscription failed — kept separate
  // so a promotion that genuinely has no tasks yet doesn't look the same as one that failed to load.
  const [errors, setErrors] = useState({});
  const unsubsRef = useRef({});
  const idsKey = promoIds.join(',');
  useEffect(() => {
    const currentIds = new Set(promoIds);
    promoIds.forEach((id) => {
      if (!unsubsRef.current[id]) {
        unsubsRef.current[id] = onSnapshot(
          collection(fdb, 'promotions', id, 'tasks'),
          (snap) => {
            const tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setTasksByPromo((prev) => ({ ...prev, [id]: tasks }));
            setErrors((prev) => (id in prev ? (() => { const next = { ...prev }; delete next[id]; return next; })() : prev));
          },
          (err) => {
            setErrors((prev) => ({ ...prev, [id]: err.message || 'Could not load tasks.' }));
          }
        );
      }
    });
    Object.keys(unsubsRef.current).forEach((id) => {
      if (!currentIds.has(id)) {
        unsubsRef.current[id]();
        delete unsubsRef.current[id];
        setTasksByPromo((prev) => { const next = { ...prev }; delete next[id]; return next; });
        setErrors((prev) => (id in prev ? (() => { const next = { ...prev }; delete next[id]; return next; })() : prev));
      }
    });
  }, [idsKey]);
  useEffect(() => () => { Object.values(unsubsRef.current).forEach((fn) => fn()); }, []);
  return { tasksByPromo, errors };
}

// A small non-blocking notification stack, replacing window.alert() for the error/validation
// messages sprinkled through the save/delete/move handlers — those still need to interrupt and
// explain what went wrong, but a native alert() blocks the whole tab and looks like the browser
// yelling at you, not the app talking to you. Auto-dismisses; also closeable by hand.
function useToasts() {
  const [toasts, setToasts] = useState([]);
  // options: { actionLabel, onAction } — an optional inline action (e.g. "Undo") shown
  // alongside the message, for as long as the toast itself is on screen.
  function pushToast(message, tone, options) {
    const id = genId();
    const { actionLabel, onAction } = options || {};
    setToasts((prev) => [...prev, { id, message, tone: tone || 'error', actionLabel, onAction }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 6000);
  }
  function dismissToast(id) {
    setToasts((prev) => prev.filter((t) => t.id !== id));
  }
  return { toasts, pushToast, dismissToast };
}

// Delete-with-undo: hides the item locally right away (via the returned pendingKeys set, which
// callers filter their lists by) and defers the real Firestore delete for a few seconds behind
// a toast's "Undo" action. Nothing is actually removed unless that window elapses without
// Undo being clicked, so replaces window.confirm on these deletes rather than stacking with it.
function useUndoableDelete(pushToast) {
  const [pendingKeys, setPendingKeys] = useState(new Set());
  const timersRef = useRef({});

  useEffect(() => () => { Object.values(timersRef.current).forEach(clearTimeout); }, []);

  function deleteWithUndo(key, label, performDelete) {
    setPendingKeys((prev) => new Set(prev).add(key));
    const timer = setTimeout(async () => {
      delete timersRef.current[key];
      try {
        await performDelete();
      } catch (err) {
        pushToast(`Could not delete "${label}": ` + err.message);
      }
      setPendingKeys((prev) => { const next = new Set(prev); next.delete(key); return next; });
    }, 6000);
    timersRef.current[key] = timer;
    pushToast(`Deleted "${label}".`, 'info', {
      actionLabel: 'Undo',
      onAction: () => {
        clearTimeout(timersRef.current[key]);
        delete timersRef.current[key];
        setPendingKeys((prev) => { const next = new Set(prev); next.delete(key); return next; });
      },
    });
  }

  return { pendingKeys, deleteWithUndo };
}

function useActivityLog(active) {
  const [entries, setEntries] = useState(null); // null = loading
  const [error, setError] = useState(null);
  useEffect(() => {
    if (!active) return;
    const q = query(collection(fdb, 'activity'), orderBy('at', 'desc'), limit(100));
    const unsub = onSnapshot(
      q,
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setError(null); },
      (err) => { setEntries((prev) => prev || []); setError(err.message || 'Could not load the activity log.'); }
    );
    return unsub;
  }, [active]);
  return { entries, error };
}

// Per-item history — a filtered slice of the activity log for one specific task/promotion/
// email/test, so a modal can show "what happened to this" without scrolling the full Activity
// tab. Matched on the item's own id (taskId/promoId/emailId/testId), which older entries logged
// before this existed won't have — those just don't show up here; history starts from when this
// shipped, same as any schema addition. A single equality filter needs no composite index
// (unlike filter+orderBy on a different field), so results are sorted client-side instead.
function useItemHistory(field, id) {
  const [entries, setEntries] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (!field || !id) { setEntries(null); setError(null); return; }
    const q = query(collection(fdb, 'activity'), where(field, '==', id));
    const unsub = onSnapshot(
      q,
      (snap) => {
        const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => {
          const at = a.at && typeof a.at.toMillis === 'function' ? a.at.toMillis() : 0;
          const bt = b.at && typeof b.at.toMillis === 'function' ? b.at.toMillis() : 0;
          return bt - at;
        });
        setEntries(list);
        setError(null);
      },
      (err) => { setEntries((prev) => prev || []); setError(err.message || 'Could not load history.'); }
    );
    return unsub;
  }, [field, id]);
  return { entries, error };
}

// A comment thread lives at pathSegments (e.g. ['promotions', promoId, 'comments'] or
// ['promotions', promoId, 'tasks', taskId, 'comments']) — one subcollection per commentable
// item, oldest first. Only subscribes once every segment is a real id (an unsaved new item has
// no id yet, so there's nothing to comment on).
function useComments(pathSegments) {
  const [comments, setComments] = useState(null);
  const [error, setError] = useState(null);
  const key = pathSegments.join('/');
  const ready = pathSegments.every(Boolean);
  useEffect(() => {
    if (!ready) { setComments(null); setError(null); return; }
    const q = query(collection(fdb, ...pathSegments), orderBy('at', 'asc'));
    const unsub = onSnapshot(
      q,
      (snap) => { setComments(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setError(null); },
      (err) => { setComments((prev) => prev || []); setError(err.message || 'Could not load comments.'); }
    );
    return unsub;
  }, [key, ready]);
  return { comments, error };
}

// @mentions in comments: "@Name" or "@FirstName" recognized against the team directory — no
// autocomplete, just highlighting of names that already exist, plus recording which users were
// mentioned on the comment doc itself so a future notification feature has something to read
// without re-parsing every comment's text.
function mentionRegex(users) {
  const list = (users || []).filter((u) => u.displayName || u.email);
  if (!list.length) return null;
  const tokens = new Set();
  list.forEach((u) => {
    const name = u.displayName || u.email;
    tokens.add(name);
    const first = name.split(' ')[0];
    if (first) tokens.add(first);
  });
  // Longest names first so "@Sam Brooker" matches whole before "@Sam" would grab just the start.
  const sorted = Array.from(tokens).sort((a, b) => b.length - a.length);
  const escaped = sorted.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp(`@(${escaped.join('|')})\\b`, 'gi');
}

function renderCommentText(text, users) {
  const re = mentionRegex(users);
  if (!re || !text) return text;
  const parts = [];
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = re.exec(text)) !== null) {
    if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
    parts.push(e('strong', { key: key++, style: { color: PURPLE_TEXT, fontWeight: 700 } }, `@${match[1]}`));
    lastIndex = re.lastIndex;
  }
  if (lastIndex < text.length) parts.push(text.slice(lastIndex));
  return parts.length ? parts : text;
}

function mentionedEmails(text, users) {
  const re = mentionRegex(users);
  if (!re || !text) return [];
  const found = new Set();
  let match;
  while ((match = re.exec(text)) !== null) {
    const token = match[1].toLowerCase();
    const u = (users || []).find((u2) => {
      const name = u2.displayName || u2.email;
      return name.toLowerCase() === token || name.split(' ')[0].toLowerCase() === token;
    });
    if (u) found.add(u.email);
  }
  return Array.from(found);
}

// Reusable comment thread, dropped into any modal for an already-saved item (pathSegments
// points at that item's own 'comments' subcollection). Anyone on the allowlist can read every
// comment; only the author can delete their own.
function CommentsThread({ pathSegments, currentUserEmail, currentUserName, users, pushToast }) {
  const { comments, error } = useComments(pathSegments);

  // (or just opening a long thread) leaves it out of sight in the fixed-height scroll box.
  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [commentCount]);

  async function submit() {
    if (!text.trim() || busy) return;
    setBusy(true);

          e(
            'div',

// Attachment metadata lives at pathSegments (e.g. ['promotions', promoId, 'attachments']),
// mirroring the comments subcollection pattern — one doc per uploaded file, oldest first. The
// file bytes themselves live in Firebase Storage under a matching path; this collection just
// tracks who uploaded what, so the UI never has to list a Storage folder directly.
function useAttachments(pathSegments) {
  const [attachments, setAttachments] = useState(null);
  const [error, setError] = useState(null);
  const key = pathSegments.join('/');
  const ready = pathSegments.every(Boolean);
  useEffect(() => {
    if (!ready) { setAttachments(null); setError(null); return; }
    const q = query(collection(fdb, ...pathSegments), orderBy('at', 'asc'));
    const unsub = onSnapshot(
      q,
      (snap) => { setAttachments(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setError(null); },
      (err) => { setAttachments((prev) => prev || []); setError(err.message || 'Could not load attachments.'); }
    );
    return unsub;
  }, [key, ready]);
  return { attachments, error };
}

const MAX_ATTACHMENT_BYTES = 10 * 1024 * 1024;

function formatFileSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

// Reusable attachments list + uploader, dropped into any modal for an already-saved item
// (pathSegments points at that item's own 'attachments' subcollection). Storage object path
// mirrors pathSegments so rules can gate on the same allowlist as everything else. Anyone on
// the allowlist can read/upload; only the uploader can delete their own file.
function AttachmentsSection({ pathSegments, currentUserEmail, currentUserName, pushToast }) {
  const { attachments, error } = useAttachments(pathSegments);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  async function handleFiles(files) {
    if (!files || !files.length) return;
    const file = files[0];
    if (file.size > MAX_ATTACHMENT_BYTES) {
      pushToast(`"${file.name}" is over the 10MB attachment limit.`);
      return;
    }
    setUploading(true);
    try {
      const storagePath = `attachments/${pathSegments.join('/')}/${Date.now()}_${file.name}`;
      const storageRef = ref(storage, storagePath);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      await addDoc(collection(fdb, ...pathSegments), {
        name: file.name, size: file.size, contentType: file.type || '',
        storagePath, url, by: currentUserName, byEmail: currentUserEmail, at: serverTimestamp(),
      });
    } catch (err) {
      pushToast('Could not upload file: ' + err.message);
    } finally {
      setUploading(false);
    }
  }

  async function removeAttachment(a) {
    if (!window.confirm(`Delete "${a.name}"?`)) return;
    try {
      await deleteDoc(doc(fdb, ...pathSegments, a.id));
      await deleteObject(ref(storage, a.storagePath)).catch(() => {});
    } catch (err) {
      pushToast('Could not delete attachment: ' + err.message);
    }
  }

  return e(
    'div',
    { style: { marginTop: '1.25rem', paddingTop: '1rem', borderTop: '1px solid var(--border)' } },
    e(
      'div',
      { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.5rem' } },
      e('div', { style: { fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-secondary)' } }, 'Attachments'),
      e(
        'button',
        {
          onClick: () => fileInputRef.current && fileInputRef.current.click(),
          disabled: uploading,
          style: { fontSize: '0.75rem', color: PURPLE_TEXT, background: 'none', border: 'none', cursor: uploading ? 'default' : 'pointer', padding: 0, fontWeight: 600, opacity: uploading ? 0.6 : 1 },
        },
        uploading ? 'Uploading…' : '+ Add file'
      ),
      e('input', {
        ref: fileInputRef, type: 'file', style: { display: 'none' },
        onChange: (ev) => { handleFiles(ev.target.files); ev.target.value = ''; },
      })
    ),
    error && e('p', { style: { fontSize: '0.75rem', color: 'var(--danger)' } }, `Couldn't load attachments: ${error}`),
    !attachments && !error && e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, 'Loading…'),
    attachments && attachments.length === 0 && e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)' } }, 'No attachments yet.'),
    attachments && attachments.length > 0 && e(
      'div',
      { style: { display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
      attachments.map((a) => e(
        'div',
        {
          key: a.id,
          style: { display: 'flex', alignItems: 'center', gap: '0.625rem', fontSize: '0.8125rem', borderRadius: '0.5rem', padding: '0.5rem 0.625rem', background: 'var(--surface-alt)' },
        },
        a.contentType && a.contentType.startsWith('image/')
          ? e('img', { src: a.url, alt: a.name, style: { width: '2.5rem', height: '2.5rem', objectFit: 'cover', borderRadius: '0.375rem', flexShrink: 0 } })
          : e('span', { style: { fontSize: '1.25rem', flexShrink: 0 } }, '📎'),
        e(
          'div',
          { style: { flex: 1, minWidth: 0 } },
          e('a', { href: a.url, target: '_blank', rel: 'noopener noreferrer', style: { color: 'var(--text-primary)', fontWeight: 500, wordBreak: 'break-word' } }, a.name),
          e('div', { style: { fontSize: '0.6875rem', color: 'var(--text-muted)' } }, `${formatFileSize(a.size)} · ${a.by || 'Someone'} · ${formatDateTime(a.at)}`)
        ),

          onClick: () => removeAttachment(a),
          style: { fontSize: '0.6875rem', color: 'var(--text-muted)', background: 'none', border: 'none', cursor: 'pointer', padding: 0, flexShrink: 0 },
        }, 'Delete')
      ))
    )

}

const ROLE_LABELS = { admin: 'Admin', editor: 'Editor', viewer: 'Viewer' };

// Admin-only screen (see the Admin nav tab, only rendered for isAdmin) for managing who's on
// the allowlist and what they can do — the in-app alternative to hand-editing allowlist docs in
// the Firebase console. Adding someone here is literally the same write the console does

function AdminSection({ currentUserEmail, users, pushToast, isMobile }) {
  const { entries, error } = useAllowlist(true);
  const [newEmail, setNewEmail] = useState('');
  const [newRole, setNewRole] = useState('editor');
  const [busy, setBusy] = useState(false);

  function displayNameFor(email) {
    const u = (users || []).find((u2) => u2.email === email);

  }

    const email = newEmail.trim().toLowerCase();
    if (!email) return;

      await setDoc(doc(fdb, 'allowlist', email), { role: newRole, addedBy: currentUserEmail, addedAt: serverTimestamp() }, { merge: true });

  return e(

    ),
    !entries && !error && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Loading…'),
    entries && entries.length === 0 && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Nobody on the allowlist yet.'),
    entries && entries.length > 0 && e(
      'div',
      { style: { display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
      entries.slice().sort((a, b) => a.id.localeCompare(b.id)).map((en) => {
        const role = en.role || 'editor';
        const name = displayNameFor(en.id);
        const isSelf = en.id === currentUserEmail;
        return e(
          'div',
          { key: en.id, style: { display: 'flex', alignItems: 'center', gap: '0.75rem', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '0.5rem', padding: '0.625rem 0.75rem' } },
          e(
            'div',
            { style: { flex: 1, minWidth: 0 } },
            e('div', { style: { fontSize: '0.875rem', fontWeight: 600, color: PURPLE_DARK, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, name ? `${name}${isSelf ? ' (you)' : ''}` : `${en.id}${isSelf ? ' (you)' : ''}`),
            name && e('div', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, en.id)
          ),
          e('select', {
            value: role,
            onChange: (ev) => changeRole(en.id, ev.target.value),
            style: { ...inputStyle, width: 'auto', flexShrink: 0 },
          }, Object.keys(ROLE_LABELS).map((r) => e('option', { key: r, value: r }, ROLE_LABELS[r]))),
          e('button', {
            onClick: () => removeEntry(en.id),
            disabled: isSelf,
            title: isSelf ? "You can't revoke your own access" : 'Revoke access',
            style: { fontSize: '0.8125rem', color: isSelf ? 'var(--text-muted)' : 'var(--danger)', background: 'none', border: 'none', cursor: isSelf ? 'default' : 'pointer', padding: 0, flexShrink: 0, opacity: isSelf ? 0.5 : 1 },
          }, 'Revoke')
        );
      })
    )
  );
}

function PromotionPlanner({ user }) {
  const online = useOnlineStatus();
  const [theme, setTheme] = useTheme();
  const isMobile = useIsMobile();
  const pagePadding = isMobile ? '1rem' : '1.5rem 2rem';
  const seededRef = useRef(false);
  const actorName = user.displayName || user.email;
  const { toasts, pushToast, dismissToast } = useToasts();
  const { pendingKeys: pendingDeleteKeys, deleteWithUndo } = useUndoableDelete(pushToast);
  const { users, error: usersError } = useUsersDirectory();
  const myRole = useMyRole(user.email); // null while loading, then 'admin' | 'editor' | 'viewer'
  const canEdit = myRole !== 'viewer'; // optimistic while loading (null), matches the 'editor' default
  const isAdmin = myRole === 'admin';

  // Registers/refreshes this viewer in the team directory (used to populate assignee
  // dropdowns) — organic, no admin step needed. Runs once per sign-in.
  useEffect(() => {
    setDoc(doc(fdb, 'users', user.email), { email: user.email, displayName: user.displayName || user.email, lastSeen: serverTimestamp() }, { merge: true }).catch(() => {});
  }, [user.email, user.displayName]);

  async function logActivity(entry) {
    try { await addDoc(collection(fdb, 'activity'), { ...entry, by: actorName, at: serverTimestamp() }); } catch (err) {}
  }

  const { docs: promoDocs, error: promoDocsError } = usePromotionsCollection();
  const promoIds = useMemo(() => (promoDocs || []).map((p) => p.id), [promoDocs]);
  const { tasksByPromo, errors: taskErrors } = useTasksByPromo(promoIds);
  const { docs: emailsRaw, error: emailsError } = useEmailsCollection();
  const { docs: paidTestsRaw, error: paidTestsError } = useCollectionDocs('paidTests', 'startDate');
  const { docs: croTestsRaw, error: croTestsError } = useCollectionDocs('croTests', 'startDate');
  const { docs: promoTemplates, error: promoTemplatesError } = useCollectionDocs('promoTemplates', 'name');

  // Items pending an undoable delete are filtered out right here, once, so every downstream
  // consumer (boards, Overview, Stats, My Work, search, exports) sees them gone immediately —
  // without each of those needing its own awareness of pendingDeleteKeys. Once the 6s window
  // passes, the real delete just sets `deleted: true` (soft delete — see removeTask etc.) rather
  // than actually removing the doc, so it's filtered out here too, permanently, until someone
  // restores it from Recently Deleted.
  const emails = useMemo(() => (!emailsRaw ? emailsRaw : emailsRaw.filter((em) => !em.deleted && !pendingDeleteKeys.has(`email:${em.id}`))), [emailsRaw, pendingDeleteKeys]);
  const paidTests = useMemo(() => (!paidTestsRaw ? paidTestsRaw : paidTestsRaw.filter((t) => !t.deleted && !pendingDeleteKeys.has(`paidTest:${t.id}`))), [paidTestsRaw, pendingDeleteKeys]);
  const croTests = useMemo(() => (!croTestsRaw ? croTestsRaw : croTestsRaw.filter((t) => !t.deleted && !pendingDeleteKeys.has(`croTest:${t.id}`))), [croTestsRaw, pendingDeleteKeys]);

  // Seed the store once, guarded by a transaction so concurrent first-openers don't double-seed.
  useEffect(() => {
    if (seededRef.current) return;
    seededRef.current = true;
    (async () => {
      try {
        const shouldSeed = await runTransaction(fdb, async (tx) => {
          const sentinelRef = doc(fdb, 'meta', 'seed');
          const snap = await tx.get(sentinelRef);
          if (snap.exists()) return false;
          tx.set(sentinelRef, { seededAt: Date.now() });
          return true;
        });
        if (!shouldSeed) return;
        const seed = seedPromotions();
        for (const promo of seed) {
          const { tasks, id, ...meta } = promo;
          await setDoc(doc(fdb, 'promotions', id), meta);
          for (const task of tasks) {
            const { id: taskId, ...taskData } = task;
            await setDoc(doc(fdb, 'promotions', id, 'tasks', taskId), taskData);
          }
        }
      } catch (err) { /* seeding is best-effort */ }
    })();
  }, []);

  const promotions = useMemo(() => {
    if (!promoDocs) return null;
    return promoDocs
      .filter((p) => !p.deleted && !pendingDeleteKeys.has(`promo:${p.id}`))
      .map((p) => ({ ...p, tasks: (tasksByPromo[p.id] || []).filter((t) => !t.deleted && !pendingDeleteKeys.has(`task:${t.id}`)) }));
  }, [promoDocs, tasksByPromo, pendingDeleteKeys]);

  // Recently Deleted (Activity tab): every soft-deleted doc, newest first. A task under an
  // already-deleted promotion is left out — the promotion's own row covers it, and restoring
  // the promotion alone shouldn't silently un-delete a task someone deleted separately.
  const deletedItems = useMemo(() => {
    const items = [];
    const sortKey = (ts) => (ts && typeof ts.toMillis === 'function' ? ts.toMillis() : 0);
    (promoDocs || []).forEach((p) => {
      if (p.deleted) {
        items.push({
          key: `promo:${p.id}`, typeLabel: 'Promotion', title: p.name, context: 'Promotion',
          deletedAt: p.deletedAt, deletedBy: p.deletedBy,
          restore: () => restorePromotion(p.id, p.name),
          purge: () => purgePromotion(p.id, p.name),
        });
      } else {
        (tasksByPromo[p.id] || []).forEach((t) => {
          if (!t.deleted) return;
          items.push({
            key: `task:${t.id}`, typeLabel: 'Task', title: t.title, context: p.name,
            deletedAt: t.deletedAt, deletedBy: t.deletedBy,
            restore: () => restoreTask(p.id, p.name, t.id, t.title),
            purge: () => purgeTask(p.id, p.name, t.id, t.title),
          });
        });
      }
    });
    (emailsRaw || []).forEach((em) => {
      if (!em.deleted) return;
      items.push({
        key: `email:${em.id}`, typeLabel: 'Email', title: em.subject, context: 'Email',
        deletedAt: em.deletedAt, deletedBy: em.deletedBy,
        restore: () => restoreEmail(em.id, em.subject),
        purge: () => purgeEmail(em.id, em.subject),
      });
    });
    (paidTestsRaw || []).forEach((t) => {
      if (!t.deleted) return;
      items.push({
        key: `paidTest:${t.id}`, typeLabel: 'Paid Media Test', title: t.name, context: 'Paid Media Test',
        deletedAt: t.deletedAt, deletedBy: t.deletedBy,
        restore: () => restoreTestItem('paidTests', 'Paid Media Test', t.id, t.name),
        purge: () => purgeTestItem('paidTests', 'Paid Media Test', t.id, t.name),
      });
    });
    (croTestsRaw || []).forEach((t) => {
      if (!t.deleted) return;
      items.push({
        key: `croTest:${t.id}`, typeLabel: 'CRO/UX Test', title: t.name, context: 'CRO/UX Test',
        deletedAt: t.deletedAt, deletedBy: t.deletedBy,
        restore: () => restoreTestItem('croTests', 'CRO/UX Test', t.id, t.name),
        purge: () => purgeTestItem('croTests', 'CRO/UX Test', t.id, t.name),
      });
    });
    items.sort((a, b) => sortKey(b.deletedAt) - sortKey(a.deletedAt));
    return items;
  }, [promoDocs, tasksByPromo, emailsRaw, paidTestsRaw, croTestsRaw]);

  const timelinePromotions = useMemo(() => (promotions || []).filter((p) => !p.archived), [promotions]);

  // Merged, chronologically-sorted list for the unified Overview timeline.
  const rollupItems = useMemo(() => {
    const items = [];
    timelinePromotions.forEach((p) => items.push({
      id: `promotion-${p.id}`, kind: 'promotion', name: p.name, dates: taskDates(p), stage: promoStageLabel(p),
      assignees: [...new Set((p.tasks || []).map((t) => t.assignee).filter(Boolean))],
      onOpen: () => { setActivePromoId(p.id); setSection('boards'); setActiveBoard('promotions'); setPromoView('board'); },
    }));
    (emails || []).forEach((em) => {
      const d = em.sendDate ? new Date(em.sendDate) : new Date();
      items.push({
        id: `email-${em.id}`, kind: 'email', name: em.subject, dates: { start: d, launch: d, end: d, hasRealEnd: false }, stage: em.status,
        assignees: em.assignee ? [em.assignee] : [],
        onOpen: () => { setSection('boards'); setActiveBoard('retention'); setEmailView('board'); openEditEmail(em); },
      });
    });
    (paidTests || []).forEach((t) => items.push({
      id: `paid-${t.id}`, kind: 'paid', name: t.name, dates: testDates(t), stage: t.status,
      assignees: t.assignee ? [t.assignee] : [],
      onOpen: () => { setSection('boards'); setActiveBoard('acquisition'); setAcqView('board'); openEditTest(TEST_TRACKERS.paid, t); },
    }));
    (croTests || []).forEach((t) => items.push({
      id: `cro-${t.id}`, kind: 'cro', name: t.name, dates: testDates(t), stage: t.status,
      assignees: t.assignee ? [t.assignee] : [],
      onOpen: () => { setSection('boards'); setActiveBoard('website'); setWebView('board'); openEditTest(TEST_TRACKERS.cro, t); },
    }));
    items.sort((a, b) => a.dates.launch.getTime() - b.dates.launch.getTime());
    return items;
  }, [timelinePromotions, emails, paidTests, croTests]);

  // Everything assigned to the signed-in viewer, across tasks (not whole promotions —
  // assignment lives at the task level there) plus emails and both test trackers.
  const myWorkItems = useMemo(() => {
    const email = user.email;
    const items = [];
    timelinePromotions.forEach((p) => {
      (p.tasks || []).forEach((t) => {
        if (t.assignee !== email) return;
        const team = TEAMS.find((tm) => tm.id === t.team);
        items.push({
          id: `mytask-${t.id}`, type: 'task', title: t.title, context: p.name, due: t.due, status: t.status,
          badge: team ? { label: team.label, color: team.color, bg: `rgba(${team.rgb}, 0.16)` } : ROLLUP_KINDS.promotion,
          onOpen: () => { setActivePromoId(p.id); setSection('boards'); setActiveBoard('promotions'); setPromoView('board'); },
        });
      });
    });
    (emails || []).forEach((em) => {
      if (em.assignee !== email) return;
      items.push({
        id: `myemail-${em.id}`, type: 'email', title: em.subject, context: 'Email', due: em.sendDate, status: em.status, badge: ROLLUP_KINDS.email,
        onOpen: () => { setSection('boards'); setActiveBoard('retention'); setEmailView('board'); openEditEmail(em); },
      });
    });
    (paidTests || []).forEach((t) => {
      if (t.assignee !== email) return;
      items.push({
        id: `mypaid-${t.id}`, type: 'paid', title: t.name, context: 'Paid Media Test', due: t.startDate, status: t.status, badge: ROLLUP_KINDS.paid,
        onOpen: () => { setSection('boards'); setActiveBoard('acquisition'); setAcqView('board'); openEditTest(TEST_TRACKERS.paid, t); },
      });
    });
    (croTests || []).forEach((t) => {
      if (t.assignee !== email) return;
      items.push({
        id: `mycro-${t.id}`, type: 'cro', title: t.name, context: 'CRO/UX Test', due: t.startDate, status: t.status, badge: ROLLUP_KINDS.cro,
        onOpen: () => { setSection('boards'); setActiveBoard('website'); setWebView('board'); openEditTest(TEST_TRACKERS.cro, t); },
      });
    });
    items.sort((a, b) => {
      const at = a.due ? new Date(a.due).getTime() : Infinity;
      const bt = b.due ? new Date(b.due).getTime() : Infinity;
      return at - bt;
    });
    return items;
  }, [timelinePromotions, emails, paidTests, croTests, user.email]);

  // The header's reminder bell: just myWorkItems narrowed to "due today or overdue, and still
  // open" — nothing new stored or computed server-side, so it only ever reflects what's true the
  // moment someone has the app open (see README for the passive-vs-active reminder tradeoff).
  const dueReminders = useMemo(() => {
    const todayKey = toDateKey(new Date());
    return myWorkItems.filter((it) => it.due && (it.due === todayKey || daysUntil(it.due) < 0) && isOpenForReminder(it.type, it.status));
  }, [myWorkItems]);

  // A handful of headline numbers pulled from data already loaded above — nothing new to
  // maintain, no separate reporting step. "Decided" tests are Win/Loss only; TBD/Inconclusive
  // don't count toward a win rate either way. Overdue only looks at non-archived promotions —
  // an archived one is done, not slipping.
  const stats = useMemo(() => {
    const now = new Date();
    const ymPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    let promosLive = 0;
    let promosInPrep = 0;
    timelinePromotions.forEach((p) => {
      const launched = daysUntil(p.launchDate) <= 0;
      const ended = p.endDate && daysUntil(p.endDate) < 0;
      if (launched && !ended) promosLive++;
      else if (!launched) promosInPrep++;
    });
    const promosArchived = (promotions || []).filter((p) => p.archived).length;

    function testTrackerStats(items) {
      const list = items || [];
      const wins = list.filter((t) => t.outcome === 'Win').length;
      const losses = list.filter((t) => t.outcome === 'Loss').length;
      const decided = wins + losses;
      return {
        winRate: decided > 0 ? Math.round((wins / decided) * 100) : null,
        live: list.filter((t) => t.status === 'Live').length,
        total: list.length,
      };
    }

    const emailsThisMonth = (emails || []).filter((em) => em.sendDate && em.sendDate.startsWith(ymPrefix));
    const emailsSentThisMonth = emailsThisMonth.filter((em) => em.status === 'Sent' || em.status === 'Reported').length;

    let overdueTasks = 0;
    timelinePromotions.forEach((p) => {
      (p.tasks || []).forEach((t) => {
        if (t.due && daysUntil(t.due) < 0 && t.status !== 'Live' && t.status !== 'Reports') overdueTasks++;
      });
    });
    const overdueEmails = (emails || []).filter((em) => em.sendDate && daysUntil(em.sendDate) < 0 && em.status !== 'Sent' && em.status !== 'Reported').length;

    return {
      promosLive, promosInPrep, promosArchived,
      paid: testTrackerStats(paidTests),
      cro: testTrackerStats(croTests),
      emailsThisMonth: emailsThisMonth.length,
      emailsSentThisMonth,
      overdue: overdueTasks + overdueEmails,
    };
  }, [timelinePromotions, promotions, paidTests, croTests, emails]);

  // Flat, cross-type search index for the header's global search box — the same onOpen
  // navigation pattern rollupItems/myWorkItems already use, just including individual tasks too
  // (Overview only surfaces whole promotions, not the tasks inside them).
  const globalSearchIndex = useMemo(() => {
    const items = [];
    (promotions || []).forEach((p) => {
      items.push({
        id: `gs-promo-${p.id}`, kind: ROLLUP_KINDS.promotion, name: p.name, context: p.archived ? 'Promotion (archived)' : 'Promotion',
        // showArchived only affects the tab strip's own filter, not which promotion is
        // active — without this an archived result would open correctly but its tab
        // wouldn't be visible/highlighted above it.
        onOpen: () => { setActivePromoId(p.id); setSection('boards'); setActiveBoard('promotions'); setPromoView('board'); if (p.archived) setShowArchived(true); },
      });
      (p.tasks || []).forEach((t) => {
        const team = TEAMS.find((tm) => tm.id === t.team);
        items.push({
          id: `gs-task-${t.id}`, kind: team ? { label: team.label, color: team.color, bg: `rgba(${team.rgb}, 0.16)` } : ROLLUP_KINDS.promotion, name: t.title, context: p.name,
          onOpen: () => { setActivePromoId(p.id); setSection('boards'); setActiveBoard('promotions'); setPromoView('board'); if (p.archived) setShowArchived(true); openEditTask(t); },
        });
      });
    });
    (emails || []).forEach((em) => items.push({
      id: `gs-email-${em.id}`, kind: ROLLUP_KINDS.email, name: em.subject, context: 'Email',
      onOpen: () => { setSection('boards'); setActiveBoard('retention'); setEmailView('board'); openEditEmail(em); },
    }));
    (paidTests || []).forEach((t) => items.push({
      id: `gs-paid-${t.id}`, kind: ROLLUP_KINDS.paid, name: t.name, context: 'Paid Media Test',
      onOpen: () => { setSection('boards'); setActiveBoard('acquisition'); setAcqView('board'); openEditTest(TEST_TRACKERS.paid, t); },
    }));
    (croTests || []).forEach((t) => items.push({
      id: `gs-cro-${t.id}`, kind: ROLLUP_KINDS.cro, name: t.name, context: 'CRO/UX Test',
      onOpen: () => { setSection('boards'); setActiveBoard('website'); setWebView('board'); openEditTest(TEST_TRACKERS.cro, t); },
    }));
    return items;
  }, [promotions, emails, paidTests, croTests]);

  const [globalSearchQuery, setGlobalSearchQuery] = useState('');
  const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
  const globalSearchRef = useRef(null);
  useEffect(() => {
    function onDocMouseDown(ev) {
      if (globalSearchRef.current && !globalSearchRef.current.contains(ev.target)) setGlobalSearchOpen(false);
    }
    document.addEventListener('mousedown', onDocMouseDown);
    return () => document.removeEventListener('mousedown', onDocMouseDown);
  }, []);
  const globalSearchResults = useMemo(() => {
    const q = globalSearchQuery.trim().toLowerCase();
    if (!q) return [];
    return globalSearchIndex.filter((it) => (it.name + ' ' + it.context).toLowerCase().includes(q)).slice(0, 8);
  }, [globalSearchQuery, globalSearchIndex]);
  function selectGlobalSearchResult(it) {
    it.onOpen();
    setGlobalSearchQuery('');
    setGlobalSearchOpen(false);
  }

  const [remindersOpen, setRemindersOpen] = useState(false);
  const remindersRef = useRef(null);
  useEffect(() => {
    function onDocMouseDown(ev) {
      if (remindersRef.current && !remindersRef.current.contains(ev.target)) setRemindersOpen(false);
    }
    document.addEventListener('mousedown', onDocMouseDown);
    return () => document.removeEventListener('mousedown', onDocMouseDown);
  }, []);

  const [activePromoId, setActivePromoId] = useState(null);
  useEffect(() => {
    if (promotions && promotions.length && !activePromoId) {
      setActivePromoId((promotions.find((p) => !p.archived) || promotions[0]).id);
    }
  }, [promotions]);

  // Top-level navigation is My Work / Overview / Stats / Boards / Activity — the four team
  // channels (Promotions/Acquisition/Retention/Website) live inside "Boards" behind their own
  // switcher, rather than each getting its own top-level pill, so each remembers its own
  // board/timeline(/calendar) sub-view.
  const [section, setSection] = useState('boards'); // 'mywork' | 'overview' | 'stats' | 'boards' | 'activity'
  const [activeBoard, setActiveBoard] = useState('promotions'); // 'promotions' | 'acquisition' | 'retention' | 'website'
  const [promoView, setPromoView] = useState('board'); // 'board' | 'timeline'
  const [acqView, setAcqView] = useState('board'); // 'board' | 'timeline' (Paid Media)
  const [webView, setWebView] = useState('board'); // 'board' | 'timeline' (CRO/UX)
  const [activityView, setActivityView] = useState('log'); // 'log' | 'deleted'
  const { entries: activityEntries, error: activityError } = useActivityLog(section === 'activity');
  const timelineScrollRef = useRef(null);
  useDragScroll(timelineScrollRef);
  useEffect(() => {
    if (!timelineScrollRef.current) return;
    let items = null;
    let getDates = null;
    if (section === 'overview') { items = rollupItems; getDates = (it) => it.dates; }
    else if (section === 'boards' && activeBoard === 'promotions' && promoView === 'timeline') { items = timelinePromotions; getDates = taskDates; }
    else if (section === 'boards' && activeBoard === 'acquisition' && acqView === 'timeline') { items = paidTests || []; getDates = testDates; }
    else if (section === 'boards' && activeBoard === 'website' && webView === 'timeline') { items = croTests || []; getDates = testDates; }
    else return;
    const r = computeRange(items, getDates);
    const dayWidth = isMobile ? 22 : 34;
    timelineScrollRef.current.scrollLeft = Math.max(dayOffsetPx(new Date(), r.min, dayWidth) - 80, 0);
  }, [section, activeBoard, promoView, acqView, webView, rollupItems, timelinePromotions, paidTests, croTests, isMobile]);
  const [showArchived, setShowArchived] = useState(false);
  const [overviewSearch, setOverviewSearch] = useState('');
  const [overviewKinds, setOverviewKinds] = useState(new Set());
  const [overviewAssignee, setOverviewAssignee] = useState('');
  const { views: savedViews, saveView, deleteView } = useSavedViews();
  const [savingView, setSavingView] = useState(false);
  const [newViewName, setNewViewName] = useState('');
  const [activeFilters, setActiveFilters] = useState(new Set());
  const [draggedTaskId, setDraggedTaskId] = useState(null);
  const [taskModal, setTaskModal] = useState(false);
  const [promoModal, setPromoModal] = useState(false);
  const [promoForm, setPromoForm] = useState(null);
  const [selectedTemplateId, setSelectedTemplateId] = useState('');
  const [templatesModalOpen, setTemplatesModalOpen] = useState(false);
  const [taskForm, setTaskForm] = useState(null);
  const [busy, setBusy] = useState(false);
  const [emailView, setEmailView] = useState('board');
  const [calendarMonth, setCalendarMonth] = useState(() => startOfMonth(new Date()));
  const [emailModal, setEmailModal] = useState(false);
  const [emailForm, setEmailForm] = useState(null);
  const [draggedEmailId, setDraggedEmailId] = useState(null);
  const [testModal, setTestModal] = useState(false);
  const [testForm, setTestForm] = useState(null);
  const [draggedTestId, setDraggedTestId] = useState(null);

  const activePromo = promotions ? (promotions.find((p) => p.id === activePromoId) || promotions[0]) : null;

  function progressFor(promo) {
    if (!promo.tasks.length) return 0;
    const live = promo.tasks.filter((t) => t.status === 'Live' || t.status === 'Reports').length;
    return Math.round((live / promo.tasks.length) * 100);
  }

  // Assignees are stored as an email (see renderAssigneeSelect); shown as a real name wherever
  // we can resolve one from the team directory, same as the dropdowns do.
  function assigneeLabel(email) {
    if (!email) return '';
    const u = (users || []).find((u) => u.email === email);
    return u ? (u.displayName || u.email) : email;
  }

  function promoLabel(promoId) {
    if (!promoId) return '';
    const p = (promotions || []).find((pr) => pr.id === promoId);

  // --- Mutations, all against Firestore, each stamped with who/when and logged ---
  async function addTask(promoId, promoName, data) {
    setBusy(true);
    try {
      const ref = await addDoc(collection(fdb, 'promotions', promoId, 'tasks'), {
        ...data, createdBy: actorName, createdAt: serverTimestamp(), updatedBy: actorName, updatedAt: serverTimestamp(),
      });
      await logActivity({ action: 'task_created', promoId, promoName, taskId: ref.id, taskTitle: data.title });
    } finally { setBusy(false); }
  }

  async function saveExistingTask(promoId, promoName, taskId, data) {
    setBusy(true);
    try {
      // A merge update, not a full replace: older tasks saved before some fields existed
      // (createdBy/createdAt) don't carry them, and Firestore rejects `undefined` values —
      // updateDoc only touches the fields we actually pass, so that's never a problem here.
      await updateDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId), { ...data, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'task_updated', promoId, promoName, taskId, taskTitle: data.title });
    } finally { setBusy(false); }
  }

  // A "delete" only ever soft-deletes (deleted/deletedAt/deletedBy) — the doc stays put so it
  // can be brought back from Recently Deleted (see the Activity tab). Only purgeTask actually
  // removes it from Firestore.
  async function removeTask(promoId, promoName, taskId, taskTitle) {
    setBusy(true);

      await updateDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId), { deleted: true, deletedAt: serverTimestamp(), deletedBy: user.email });

    const config = findTrackerConfig(testForm.__collection);
    const blank = { id: null, status: config.statuses[0], __collection: config.collection, __label: config.label };
    config.fields.forEach((f) => {
      if (f.key === 'name') blank[f.key] = `${testForm.name || ''} (copy)`;
      else if (f.key === 'startDate' || f.key === 'endDate' || f.key === 'result') blank[f.key] = '';

      else blank[f.key] = testForm[f.key] || '';
    });
    setTestForm(blank);

  async function savePromo() {
    if (!promoForm.name.trim() || !promoForm.launchDate) {
      pushToast('Promotion name and launch date are required.');
      return;
    }
    if (promoForm.endDate && promoForm.endDate < promoForm.launchDate) {
      pushToast("End date can't be before the launch date.");
      return;
    }
    // Only the fields the form actually edits — never forward whatever else happens to be
    // sitting on promoForm (e.g. createdBy/createdAt, which older promotions may not have).
    const { id, name, launchDate, endDate, description } = promoForm;
    const data = { name, launchDate, endDate, description };
    try {
      if (id) {
        await saveExistingPromotion(id, data);
      } else {
        const newId = await createPromotion(data);
        setActivePromoId(newId);
        const tpl = selectedTemplateId ? (promoTemplates || []).find((t) => t.id === selectedTemplateId) : null;
        if (tpl) {
          for (const t of tpl.tasks || []) {
            await addTask(newId, name, { team: t.team, type: t.type, title: t.title, assignee: t.assignee || '', due: '', status: STATUSES[0], notes: '' });
          }
        }
      }
    } catch (err) {
      pushToast('Could not save this promotion: ' + err.message);
      return;
    }
    setPromoModal(false);
    setPromoForm(null);
    setSelectedTemplateId('');
  }

  function deletePromoClick() {
    if (!promoForm.id) return;
    const { id, name } = promoForm;
    // activePromoId is deliberately left as-is: if the deleted promotion was active and Undo
    // is clicked within the window, the view just keeps showing it, seamlessly. If Undo isn't
    // clicked, the existing activePromo fallback (promotions.find(...) || promotions[0]) picks
    // a visible promotion on its own once this one actually disappears from the list.
    deleteWithUndo(`promo:${id}`, name, () => deletePromotion(id, name));
    setPromoModal(false);
    setPromoForm(null);
  }
