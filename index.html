// --- Timeline helpers ---
function taskDates(promo) {
  const launch = new Date(promo.launchDate);
  const dueTimes = promo.tasks.map((t) => t.due).filter(Boolean).map((d) => new Date(d).getTime());
  const startTime = dueTimes.length ? Math.min(...dueTimes, launch.getTime()) : launch.getTime() - 14 * 86400000;
  const hasRealEnd = !!promo.endDate;
  const end = hasRealEnd ? new Date(promo.endDate) : new Date(launch.getTime() + 14 * 86400000);
  return {
    start: new Date(startTime),
    launch,
    end,
    hasRealEnd,
    // Reporting wraps up roughly two weeks after the promotion actually ends.
    reportEnd: new Date(end.getTime() + 14 * 86400000),
  };
}

function promoStageLabel(promo) {
  if (!promo.tasks.length) return 'Not started';
  const idx = Math.min(...promo.tasks.map((t) => STATUSES.indexOf(t.status)));
  return STATUSES[idx];
}

function computeRange(promotions) {
  const all = [new Date()];
  promotions.forEach((p) => {
    const { start, reportEnd } = taskDates(p);
    all.push(start, reportEnd);
  });
  const min = new Date(Math.min(...all.map((d) => d.getTime())) - 5 * 86400000);
  const max = new Date(Math.max(...all.map((d) => d.getTime())) + 5 * 86400000);
  return { min, max };
}

function pct(date, min, max) {
  const total = max.getTime() - min.getTime();
  if (total <= 0) return 0;
  return ((date.getTime() - min.getTime()) / total) * 100;
}

function monthTicks(min, max) {
  const ticks = [];
  let cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) {
    ticks.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return ticks;
}

function useAllowed(email) {
  const [allowed, setAllowed] = useState(null); // null = checking
  useEffect(() => {
    if (!email) { setAllowed(null); return; }
    let cancelled = false;
    setAllowed(null);
    getDoc(doc(fdb, 'allowlist', email))
      .then((snap) => { if (!cancelled) setAllowed(snap.exists()); })
      .catch(() => { if (!cancelled) setAllowed(false); });
    return () => { cancelled = true; };
  }, [email]);
  return allowed;
}

// --- Backend: Firestore, shared with everyone on the allowlist ---
function useOnlineStatus() {
  const [online, setOnline] = useState(typeof navigator === 'undefined' ? true : navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener('online', on);
    window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);
  return online;
}

function usePromotionsCollection() {
  const [docs, setDocs] = useState(null); // null = loading
  useEffect(() => {
    const q = query(collection(fdb, 'promotions'), orderBy('launchDate'));
    const unsub = onSnapshot(
      q,
      (snap) => setDocs(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => setDocs((prev) => prev || [])
    );
    return unsub;
  }, []);
  return docs;
}

function useTasksByPromo(promoIds) {
  const [tasksByPromo, setTasksByPromo] = useState({});
  const unsubsRef = useRef({});
  const idsKey = promoIds.join(',');
  useEffect(() => {
    const currentIds = new Set(promoIds);
    promoIds.forEach((id) => {
      if (!unsubsRef.current[id]) {
        unsubsRef.current[id] = onSnapshot(
          collection(fdb, 'promotions', id, 'tasks'),
          (snap) => {
            const tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setTasksByPromo((prev) => ({ ...prev, [id]: tasks }));
          },
          () => {}
        );
      }
    });
    Object.keys(unsubsRef.current).forEach((id) => {
      if (!currentIds.has(id)) {
        unsubsRef.current[id]();
        delete unsubsRef.current[id];
        setTasksByPromo((prev) => { const next = { ...prev }; delete next[id]; return next; });
      }
    });
  }, [idsKey]);
  useEffect(() => () => { Object.values(unsubsRef.current).forEach((fn) => fn()); }, []);
  return tasksByPromo;
}

function useActivityLog(active) {
  const [entries, setEntries] = useState(null); // null = loading
  useEffect(() => {
    if (!active) return;
    const q = query(collection(fdb, 'activity'), orderBy('at', 'desc'), limit(100));
    const unsub = onSnapshot(q, (snap) => setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setEntries((prev) => prev || []));
    return unsub;
  }, [active]);
  return entries;
}

function PromotionPlanner({ user }) {
  const online = useOnlineStatus();
  const seededRef = useRef(false);
  const actorName = user.displayName || user.email;

  async function logActivity(entry) {
    try { await addDoc(collection(fdb, 'activity'), { ...entry, by: actorName, at: serverTimestamp() }); } catch (err) {}
  }

  const promoDocs = usePromotionsCollection();
  const promoIds = useMemo(() => (promoDocs || []).map((p) => p.id), [promoDocs]);
  const tasksByPromo = useTasksByPromo(promoIds);

  // Seed the store once, guarded by a transaction so concurrent first-openers don't double-seed.
  useEffect(() => {
    if (seededRef.current) return;
    seededRef.current = true;
    (async () => {
      try {
        const shouldSeed = await runTransaction(fdb, async (tx) => {
          const sentinelRef = doc(fdb, 'meta', 'seed');
          const snap = await tx.get(sentinelRef);
          if (snap.exists()) return false;
          tx.set(sentinelRef, { seededAt: Date.now() });
          return true;
        });
        if (!shouldSeed) return;
        const seed = seedPromotions();
        for (const promo of seed) {
          const { tasks, id, ...meta } = promo;
          await setDoc(doc(fdb, 'promotions', id), meta);
          for (const task of tasks) {
            const { id: taskId, ...taskData } = task;
            await setDoc(doc(fdb, 'promotions', id, 'tasks', taskId), taskData);
          }
        }
      } catch (err) { /* seeding is best-effort */ }
    })();
  }, []);

  const promotions = useMemo(() => {
    if (!promoDocs) return null;
    return promoDocs.map((p) => ({ ...p, tasks: tasksByPromo[p.id] || [] }));
  }, [promoDocs, tasksByPromo]);

  const timelinePromotions = useMemo(() => (promotions || []).filter((p) => !p.archived), [promotions]);

  const [activePromoId, setActivePromoId] = useState(null);
  useEffect(() => {
    if (promotions && promotions.length && !activePromoId) {
      setActivePromoId((promotions.find((p) => !p.archived) || promotions[0]).id);
    }
  }, [promotions]);

  const [view, setView] = useState('board');
  const activityEntries = useActivityLog(view === 'activity');
  const [showArchived, setShowArchived] = useState(false);
  const [activeFilters, setActiveFilters] = useState(new Set());
  const [draggedTaskId, setDraggedTaskId] = useState(null);
  const [taskModal, setTaskModal] = useState(false);
  const [promoModal, setPromoModal] = useState(false);
  const [promoForm, setPromoForm] = useState(null);
  const [taskForm, setTaskForm] = useState(null);
  const [busy, setBusy] = useState(false);

  const activePromo = promotions ? (promotions.find((p) => p.id === activePromoId) || promotions[0]) : null;

  function progressFor(promo) {
    if (!promo.tasks.length) return 0;
    const live = promo.tasks.filter((t) => t.status === 'Live' || t.status === 'Reports').length;
    return Math.round((live / promo.tasks.length) * 100);
  }

  // --- Mutations, all against Firestore, each stamped with who/when and logged ---
  async function addTask(promoId, promoName, data) {
    setBusy(true);
    try {
      await addDoc(collection(fdb, 'promotions', promoId, 'tasks'), {
        ...data, createdBy: actorName, createdAt: serverTimestamp(), updatedBy: actorName, updatedAt: serverTimestamp(),
      });
      await logActivity({ action: 'task_created', promoId, promoName, taskTitle: data.title });
    } finally { setBusy(false); }
  }

  async function saveExistingTask(promoId, promoName, taskId, data) {
    setBusy(true);
    try {
      await setDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId), { ...data, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'task_updated', promoId, promoName, taskTitle: data.title });
    } finally { setBusy(false); }
  }

  async function removeTask(promoId, promoName, taskId, taskTitle) {
    setBusy(true);
    try {
      await deleteDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId));
      await logActivity({ action: 'task_deleted', promoId, promoName, taskTitle });
    } finally { setBusy(false); }
  }

  async function moveTask(promoId, promoName, taskId, taskTitle, patch, fromStatus) {
    try {
      await updateDoc(doc(fdb, 'promotions', promoId, 'tasks', taskId), { ...patch, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'task_moved', promoId, promoName, taskTitle, detail: `${fromStatus} → ${patch.status}` });
    } catch (err) {}
  }

  async function createPromotion(data) {
    setBusy(true);
    try {
      const ref = await addDoc(collection(fdb, 'promotions'), {
        ...data, createdBy: actorName, createdAt: serverTimestamp(), updatedBy: actorName, updatedAt: serverTimestamp(),
      });
      await logActivity({ action: 'promo_created', promoId: ref.id, promoName: data.name });
      return ref.id;
    } finally { setBusy(false); }
  }

  async function saveExistingPromotion(promoId, data) {
    setBusy(true);
    try {
      await setDoc(doc(fdb, 'promotions', promoId), { ...data, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: 'promo_updated', promoId, promoName: data.name });
    } finally { setBusy(false); }
  }

  async function deletePromotion(promoId, promoName) {
    setBusy(true);
    try {
      const tasksSnap = await getDocs(collection(fdb, 'promotions', promoId, 'tasks'));
      for (const t of tasksSnap.docs) await deleteDoc(doc(fdb, 'promotions', promoId, 'tasks', t.id));
      await deleteDoc(doc(fdb, 'promotions', promoId));
      await logActivity({ action: 'promo_deleted', promoName });
    } finally { setBusy(false); }
  }

  async function setPromoArchived(promoId, promoName, archived) {
    setBusy(true);
    try {
      await updateDoc(doc(fdb, 'promotions', promoId), { archived, updatedBy: actorName, updatedAt: serverTimestamp() });
      await logActivity({ action: archived ? 'promo_archived' : 'promo_unarchived', promoId, promoName });
    } finally { setBusy(false); }
  }

  async function resetData() {
    if (!window.confirm('Reset sample data? This replaces everything currently on the board for everyone.')) return;
    setBusy(true);
    try {
      const existing = await getDocs(collection(fdb, 'promotions'));
      for (const d of existing.docs) {
        const tasksSnap = await getDocs(collection(fdb, 'promotions', d.id, 'tasks'));
        for (const t of tasksSnap.docs) await deleteDoc(doc(fdb, 'promotions', d.id, 'tasks', t.id));
        await deleteDoc(doc(fdb, 'promotions', d.id));
      }
      const seed = seedPromotions();
      for (const promo of seed) {
        const { tasks, id, ...meta } = promo;
        await setDoc(doc(fdb, 'promotions', id), meta);
        for (const task of tasks) {
          const { id: taskId, ...taskData } = task;
          await setDoc(doc(fdb, 'promotions', id, 'tasks', taskId), taskData);
        }
      }
      await logActivity({ action: 'board_reset' });
      setActivePromoId(seed[0].id);
    } finally { setBusy(false); }
  }

  function handleDrop(team, status) {
    if (!draggedTaskId || !activePromo) return;
    const task = activePromo.tasks.find((t) => t.id === draggedTaskId);
    if (task && (task.team !== team || task.status !== status)) {
      moveTask(activePromo.id, activePromo.name, draggedTaskId, task.title, { team, status }, task.status);
    }
    setDraggedTaskId(null);
  }

  function openNewTask(team, status) {
    setTaskForm({ id: null, team, status, type: 'website', title: '', assignee: '', due: '', notes: '' });
    setTaskModal(true);
  }

  function openEditTask(task) {
    setTaskForm({ ...task });
    setTaskModal(true);
  }

  function saveTask() {
    if (!taskForm.title.trim() || !activePromo) return;
    const { id, ...data } = taskForm;
    if (id) saveExistingTask(activePromo.id, activePromo.name, id, data);
    else addTask(activePromo.id, activePromo.name, data);
    setTaskModal(false);
    setTaskForm(null);
  }

  function deleteTaskClick() {
    if (!activePromo) return;
    removeTask(activePromo.id, activePromo.name, taskForm.id, taskForm.title);
    setTaskModal(false);
    setTaskForm(null);
  }

  function toggleFilter(typeId) {
    setActiveFilters((prev) => {
      const next = new Set(prev);
      if (next.has(typeId)) next.delete(typeId);
      else next.add(typeId);
      return next;
    });
  }

  function openNewPromo() {
    setPromoForm({ id: null, name: '', launchDate: '', endDate: '', description: '' });
    setPromoModal(true);
  }

  function openEditPromo(promo) {
    setPromoForm({ id: promo.id, name: promo.name, launchDate: promo.launchDate, endDate: promo.endDate || '', description: promo.description || '', archived: promo.archived || false, createdBy: promo.createdBy, createdAt: promo.createdAt });
    setPromoModal(true);
  }

  async function savePromo() {
    if (!promoForm.name.trim() || !promoForm.launchDate) return;
    const { id, ...data } = promoForm;
    if (id) {
      await saveExistingPromotion(id, data);
    } else {
      const newId = await createPromotion(data);
      setActivePromoId(newId);
    }
    setPromoModal(false);
    setPromoForm(null);
  }

  async function deletePromoClick() {
    if (!promoForm.id) return;
    if (!window.confirm(`Delete "${promoForm.name}" and all its tasks? This can't be undone, and it removes the promotion for everyone.`)) return;
    await deletePromotion(promoForm.id, promoForm.name);
    setActivePromoId(null);
    setPromoModal(false);
    setPromoForm(null);
  }

  async function toggleArchivePromo() {
    if (!promoForm.id) return;
    await setPromoArchived(promoForm.id, promoForm.name, !promoForm.archived);
    if (!promoForm.archived) setActivePromoId(null); // archiving the active promotion: let the board pick a visible one
    setPromoModal(false);
    setPromoForm(null);
  }

  const daysLeft = activePromo ? daysUntil(activePromo.launchDate) : null;
  const daysToEnd = activePromo && activePromo.endDate ? daysUntil(activePromo.endDate) : null;

      promoStatusColor = daysLeft <= 7 ? 'var(--today)' : 'var(--text-secondary)';
    } else if (daysLeft === 0) {
      promoStatusText = 'Launches today';
      promoStatusColor = 'var(--today)';
    } else if (daysToEnd === null) {

      promoStatusColor = 'var(--text-muted)';

      promoStatusText = `Ends in ${daysToEnd} day${daysToEnd === 1 ? '' : 's'}`;
      promoStatusColor = daysToEnd <= 7 ? 'var(--today)' : 'var(--text-secondary)';

      promoStatusText = 'Ends today';

              : { fontSize: '0.75rem', padding: '0.375rem 0.75rem', borderRadius: '999px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text-secondary)', cursor: 'pointer' },

      );

      const gridHeader = [e('div', { key: 'blank' })].concat(

                draggable: true,

                style: { cursor: 'pointer', background: 'var(--surface)', borderRadius: '0.5rem', padding: '0.75rem', opacity: dim ? 0.3 : 1, border: '1px solid var(--border)', borderLeftWidth: '3px', borderLeftColor: team.color, borderLeftStyle: 'solid' },

        'div',
        { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '1rem', marginTop: '1rem', fontSize: '0.75rem', color: 'var(--text-muted)' } },
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '12px', height: '12px', borderRadius: '999px', background: PURPLE_LIGHT } }), 'Prep (briefing to review)'),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '12px', height: '12px', borderRadius: '999px', background: PURPLE } }), 'Live (no end date set: estimated at 14 days)'),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '999px', background: PURPLE_DARK } }), 'Launch date'),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '999px', background: 'var(--surface)', border: `2px solid ${PURPLE_DARK}`, boxSizing: 'border-box' } }), 'End date'),
        e('span', { style: { display: 'flex', alignItems: 'center', gap: '0.375rem' } }, e('span', { style: { display: 'inline-block', width: '1px', height: '12px', background: TODAY_COLOR } }), 'Today')
      ),
      e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '1.5rem' } }, "Click a promotion to open its board. Stage shown is the least-advanced team, so you can spot who's behind.")
    );
  }

  let activitySection = null;
  if (view === 'activity') {
    activitySection = e(
      'div',
      { style: { padding: '1.5rem 2rem', maxWidth: '48rem' } },
      e('p', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '1rem' } }, 'Who created and changed what, most recent first — the last 100 changes across the whole board.'),
      !activityEntries && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Loading…'),
      activityEntries && activityEntries.length === 0 && e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'No activity yet.'),
      activityEntries && activityEntries.length > 0 && e(
        'div',
        { style: { display: 'flex', flexDirection: 'column' } },
        activityEntries.map((entry) => e(
          'div',
          { key: entry.id, style: { padding: '0.625rem 0', borderBottom: '1px solid var(--border)', fontSize: '0.875rem', color: 'var(--text-primary)' } },
          e('span', { style: { fontWeight: 600 } }, entry.by || 'Someone'),
          ' ',
          ACTION_LABELS[entry.action] || entry.action,
          ' ',
          (entry.taskTitle || entry.promoName) && e('span', { style: { fontStyle: 'italic' } }, `"${entry.taskTitle || entry.promoName}"`),
          entry.taskTitle && entry.promoName && e('span', { style: { color: 'var(--text-secondary)' } }, ` in ${entry.promoName}`),
          entry.detail && e('span', { style: { color: 'var(--text-secondary)' } }, ` (${entry.detail})`),
          e('div', { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.125rem' } }, formatDateTime(entry.at))
        ))
      )
    );
  }

  let taskModalEl = null;
  if (taskModal && taskForm) {
    taskModalEl = e(
      Modal,
      { title: taskForm.id ? 'Edit task' : 'New task', onClose: () => { setTaskModal(false); setTaskForm(null); } },
      e(Field, { label: 'Team' }, e('select', { style: inputStyle, value: taskForm.team, onChange: (ev) => setTaskForm({ ...taskForm, team: ev.target.value }) }, TEAMS.map((t) => e('option', { key: t.id, value: t.id }, t.label)))),
      e(Field, { label: 'Activity type' }, e('select', { style: inputStyle, value: taskForm.type, onChange: (ev) => setTaskForm({ ...taskForm, type: ev.target.value }) }, TYPES.map((t) => e('option', { key: t.id, value: t.id }, t.label)))),
      e(Field, { label: taskForm.status === 'Reports' ? 'Result headline' : 'Task' }, e('input', { style: inputStyle, value: taskForm.title, onChange: (ev) => setTaskForm({ ...taskForm, title: ev.target.value }), placeholder: taskForm.status === 'Reports' ? 'e.g. Conversion rate 4.1 percent' : 'e.g. Brief paid social creative' })),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Assignee' }, e('input', { style: inputStyle, value: taskForm.assignee, onChange: (ev) => setTaskForm({ ...taskForm, assignee: ev.target.value }) })),
        e(Field, { label: 'Due date' }, e('input', { type: 'date', style: inputStyle, value: taskForm.due, onChange: (ev) => setTaskForm({ ...taskForm, due: ev.target.value }) }))
      ),
      e(Field, { label: 'Status' }, e('select', { style: inputStyle, value: taskForm.status, onChange: (ev) => setTaskForm({ ...taskForm, status: ev.target.value }) }, STATUSES.map((s) => e('option', { key: s, value: s }, s)))),
      e(Field, { label: taskForm.status === 'Reports' ? 'Detail on performance' : 'Notes' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: taskForm.notes, onChange: (ev) => setTaskForm({ ...taskForm, notes: ev.target.value }), placeholder: taskForm.status === 'Reports' ? 'What happened, key metrics, what to repeat or change next time' : '' })),
      taskForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${taskForm.createdBy || 'unknown'}${taskForm.createdAt ? ' · ' + formatDateTime(taskForm.createdAt) : ''}`,
        taskForm.updatedBy && e('span', null, e('br'), `Last edited by ${taskForm.updatedBy}${taskForm.updatedAt ? ' · ' + formatDateTime(taskForm.updatedAt) : ''}`)
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        taskForm.id ? e('button', { onClick: deleteTaskClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete') : e('span'),
        e('button', { onClick: saveTask, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, 'Save')
      )
    );
  }

  let promoModalEl = null;
  if (promoModal && promoForm) {
    promoModalEl = e(
      Modal,
      { title: promoForm.id ? 'Edit promotion' : 'New promotion', onClose: () => { setPromoModal(false); setPromoForm(null); } },
      e(Field, { label: 'Promotion name' }, e('input', { style: inputStyle, value: promoForm.name, onChange: (ev) => setPromoForm({ ...promoForm, name: ev.target.value }), placeholder: 'e.g. Black Friday Sale' })),
      e(
        'div',
        { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
        e(Field, { label: 'Launch date' }, e('input', { type: 'date', style: inputStyle, value: promoForm.launchDate, onChange: (ev) => setPromoForm({ ...promoForm, launchDate: ev.target.value }) })),
        e(Field, { label: 'End date (optional)' }, e('input', { type: 'date', style: inputStyle, min: promoForm.launchDate || undefined, value: promoForm.endDate || '', onChange: (ev) => setPromoForm({ ...promoForm, endDate: ev.target.value }) }))
      ),
      e(Field, { label: 'Description' }, e('textarea', { style: { ...inputStyle, minHeight: '70px' }, value: promoForm.description, onChange: (ev) => setPromoForm({ ...promoForm, description: ev.target.value }), placeholder: "What's the offer and who is it for?" })),
      promoForm.id && e(
        'p',
        { style: { fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '-0.25rem' } },
        `Created by ${promoForm.createdBy || 'unknown'}${promoForm.createdAt ? ' · ' + formatDateTime(promoForm.createdAt) : ''}`
      ),
      e(
        'div',
        { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '1.25rem' } },
        promoForm.id ? e(
          'div',
          { style: { display: 'flex', gap: '1rem' } },
          e('button', { onClick: toggleArchivePromo, style: { fontSize: '0.875rem', color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer' } }, promoForm.archived ? 'Unarchive' : 'Archive'),
          e('button', { onClick: deletePromoClick, style: { fontSize: '0.875rem', color: 'var(--danger)', background: 'none', border: 'none', cursor: 'pointer' } }, 'Delete promotion')
        ) : e('span'),
        e('button', { onClick: savePromo, style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', color: 'var(--on-accent)', fontSize: '0.875rem', fontWeight: 500, background: PURPLE, border: 'none', cursor: 'pointer' } }, promoForm.id ? 'Save changes' : 'Create promotion')
      )
    );
  }

  return e(
    'div',
    { style: { width: '100%', minHeight: '100vh', background: 'var(--bg)', fontFamily: 'Arial, Helvetica, sans-serif' } },
    header,
    viewToggle,
    boardSection,
    timelineSection,
    activitySection,
    taskModalEl,
    promoModalEl
  );
}

function App() {
  const user = useAuthUser();
  const email = user ? user.email : null;
  const allowed = useAllowed(email);

  if (user === undefined) return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking sign-in…'));
  if (user === null) return e(SignInScreen);
  if (allowed === null) return e(CenteredMessage, null, e('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)' } }, 'Checking access…'));
  if (allowed === false) return e(DeniedScreen, { user });
  return e(PromotionPlanner, { user });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
